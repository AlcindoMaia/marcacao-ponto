<html lang="pt">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Maia — Ponto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   TOKENS
═══════════════════════════════════════════ */
:root {
  --bg:         #131c25;
  --surface:    #1d2a37;
  --surface2:   #25363f;
  --border:     rgba(255,255,255,.07);
  --primary:    #b58863;
  --primary-dk: #9a7150;
  --text:       #ece5de;
  --muted:      rgba(236,229,222,.5);
  --green:      #8fbfa0;
  --red:        #e09486;
  --orange:     #e0b07a;
  --font-t:     'Oswald', sans-serif;
  --font-b:     'DM Sans', sans-serif;
  --safe-t:     env(safe-area-inset-top,    0px);
  --safe-b:     env(safe-area-inset-bottom, 0px);
}

/* ═══════════════════════════════════════════
   BASE
═══════════════════════════════════════════ */
*, *::before, *::after {
  box-sizing: border-box; margin: 0; padding: 0;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  height: 100%;
  font-family: var(--font-b);
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ═══════════════════════════════════════════
   ECRÃ — base
═══════════════════════════════════════════ */
.ecra {
  position: fixed; inset: 0;
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
}

/* ═══════════════════════════════════════════
   LOADING
═══════════════════════════════════════════ */
#ecrãLoading { background: var(--bg); gap: 18px; }

.loading-logo {
  font-family: var(--font-t);
  font-size: 26px; letter-spacing: 5px;
  text-transform: uppercase; color: var(--primary);
  font-weight: 400;
}
.loading-sub {
  font-size: 11px; letter-spacing: 2px;
  text-transform: uppercase; color: var(--muted);
}
.spinner {
  width: 32px; height: 32px;
  border: 2px solid rgba(181,136,99,.15);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ═══════════════════════════════════════════
   BLOQUEIO
═══════════════════════════════════════════ */
#ecrãBloqueio {
  background: var(--bg); gap: 14px;
  text-align: center; padding: 40px 32px;
  max-width: 380px; margin: 0 auto;
}
.bloq-icon { font-size: 48px; margin-bottom: 6px; }
#bloqueioTitulo {
  font-family: var(--font-t);
  font-size: 20px; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--primary);
  font-weight: 500;
}
#bloqueioMsg {
  font-size: 14px; line-height: 1.65; color: var(--muted);
}

/* ═══════════════════════════════════════════
   PRINCIPAL
═══════════════════════════════════════════ */
#ecrãPrincipal {
  background: var(--bg);
  justify-content: flex-start;
  overflow: hidden;
}

/* ── TOP BAR ── */
.topbar {
  width: 100%;
  flex-shrink: 0;
  padding: calc(var(--safe-t) + 12px) 20px 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  justify-content: space-between;
}
.topbar-logo {
  font-family: var(--font-t);
  font-size: 14px; letter-spacing: 3px;
  text-transform: uppercase; color: var(--primary);
  font-weight: 400;
}
.topbar-clock {
  font-family: var(--font-t);
  font-size: 16px; letter-spacing: 1px;
  color: var(--text); font-weight: 300;
  font-variant-numeric: tabular-nums;
}

/* ── SCROLLABLE BODY ── */
.app-body {
  width: 100%; flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  display: flex; flex-direction: column;
}

/* ── ID CARD ── */
.id-card {
  flex-shrink: 0;
  background: linear-gradient(160deg, var(--surface) 0%, #18232e 100%);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex; align-items: center; gap: 14px;
}
.id-avatar {
  width: 42px; height: 42px; border-radius: 50%;
  background: var(--primary); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-t); font-size: 17px; font-weight: 600;
  color: #fff; letter-spacing: 0;
}
.id-info { flex: 1; min-width: 0; }
.id-nome {
  font-size: 15px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  line-height: 1.2;
}
.id-obra {
  font-size: 12px; color: var(--muted);
  margin-top: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* Área do funcionário: escolha da obra */
.id-obra-escolha {
  margin-top: 6px; width: 100%; max-width: 100%;
  font: inherit; font-size: 13px; color: var(--text);
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 8px;
}
.estado-wrap {
  flex-shrink: 0; display: flex; flex-direction: column;
  align-items: flex-end; gap: 3px;
}
.estado-pill {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 20px; padding: 5px 11px;
}
.estado-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--muted); flex-shrink: 0;
  transition: background .3s, box-shadow .3s;
}
.estado-dot.entrada {
  background: var(--green);
  box-shadow: 0 0 0 3px rgba(143,191,160,.15);
}
.estado-dot.saida { background: var(--orange); }
.estado-label { font-size: 11px; font-weight: 500; color: var(--text); }
#estadoHora { font-size: 10px; color: var(--muted); }

/* ── BOTÃO CENTRAL ── */
.btn-zone {
  flex-shrink: 0;
  padding: 28px 20px 22px;
  display: flex; flex-direction: column;
  align-items: center; gap: 14px;
}

.btn-marcacao {
  position: relative;
  width: 172px; height: 172px;
  border-radius: 50%; border: none;
  cursor: pointer;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 5px;
  background: conic-gradient(from 200deg at 40% 60%, #c49a76, #9a7150, #c49a76);
  box-shadow:
    0 0 0 8px  rgba(181,136,99,.07),
    0 0 0 16px rgba(181,136,99,.035),
    0 10px 40px rgba(0,0,0,.6);
  transition: transform .12s ease, box-shadow .12s ease;
  overflow: hidden;
}
.btn-marcacao::after {
  content: '';
  position: absolute; inset: 0; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, rgba(255,255,255,.18), transparent 60%);
  pointer-events: none;
}
.btn-marcacao:active {
  transform: scale(.93);
  box-shadow:
    0 0 0 4px  rgba(181,136,99,.04),
    0 4px 20px rgba(0,0,0,.6);
}
.btn-marcacao.disabled { opacity: .45; pointer-events: none; }

#btnIcon   { font-size: 36px; line-height: 1; position: relative; z-index: 1; color: #fff; }
#btnLabel  {
  font-family: var(--font-t); font-size: 19px;
  letter-spacing: 3.5px; font-weight: 500;
  color: #fff; text-transform: uppercase;
  position: relative; z-index: 1;
}
#btnSublabel {
  font-size: 10px; color: rgba(255,255,255,.75);
  text-align: center; max-width: 110px; line-height: 1.3;
  position: relative; z-index: 1;
}

/* ── FEEDBACK ── */
.feedback {
  font-size: 13px; font-weight: 500;
  text-align: center; min-height: 18px;
  color: transparent; transition: color .2s;
}
.feedback.ok   { color: var(--green); }
.feedback.erro { color: var(--red); }
.feedback.info { color: var(--muted); }

/* ── DIVIDER ── */
.divider {
  flex-shrink: 0;
  height: 1px; background: var(--border);
  margin: 0 20px 0;
}

/* ── HISTÓRICO ── */
.hist-section {
  flex: 1;
  padding: 16px 20px calc(var(--safe-b) + 20px);
  min-height: 0;
}
.hist-label {
  font-family: var(--font-t);
  font-size: 10px; letter-spacing: 2.5px;
  text-transform: uppercase; color: var(--muted);
  margin-bottom: 10px;
}
.hist-lista { display: flex; flex-direction: column; gap: 3px; }

.hist-item {
  display: grid;
  grid-template-columns: 8px 1fr auto;
  align-items: center; gap: 11px;
  padding: 10px 14px;
  background: var(--surface);
  border-radius: 10px;
  border: 1px solid var(--border);
}
.hist-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--muted); flex-shrink: 0;
}
.hist-dot.entrada { background: var(--green); }
.hist-dot.saida   { background: var(--orange); }

.hist-mid {}
.hist-dia  { font-size: 13px; font-weight: 500; }
.hist-horas-line {
  font-size: 11px; color: var(--muted);
  font-variant-numeric: tabular-nums; margin-top: 1px;
}
.hist-total {
  font-family: var(--font-t);
  font-size: 13px; letter-spacing: .5px;
  color: var(--primary);
  min-width: 38px; text-align: right;
}

.hist-vazio {
  padding: 20px 0;
  font-size: 13px; color: var(--muted); text-align: center;
}
</style>
</head>
<body>

<!-- ════════════════ LOADING ════════════════ -->
<div id="ecrãLoading" class="ecra" style="display:flex">
  <div class="loading-logo">MAIA</div>
  <div class="loading-sub">Soluções</div>
  <div class="spinner"></div>
</div>

<!-- ════════════════ BLOQUEIO ════════════════ -->
<div id="ecrãBloqueio" class="ecra">
  <div class="bloq-icon">🔒</div>
  <div id="bloqueioTitulo"></div>
  <div id="bloqueioMsg"></div>
</div>

<!-- ════════════════ PRINCIPAL ════════════════ -->
<div id="ecrãPrincipal" class="ecra">

  <div class="topbar">
    <span class="topbar-logo">Maia Solutions</span>
    <span class="topbar-clock" id="horaActual">--:--:--</span>
  </div>

  <div class="app-body">

    <!-- Identidade -->
    <div class="id-card">
      <div class="id-avatar" id="funcAvatar">?</div>
      <div class="id-info">
        <div class="id-nome" id="funcNome">—</div>
        <div class="id-obra" id="obraNome">—</div>
        <select class="id-obra-escolha" id="obraEscolha" style="display:none" aria-label="Obra onde estás"></select>
      </div>
      <div class="estado-wrap">
        <div class="estado-pill">
          <div class="estado-dot" id="estadoDot"></div>
          <div class="estado-label" id="estadoLabel">—</div>
        </div>
        <div id="estadoHora"></div>
      </div>
    </div>

    <!-- Botão -->
    <div class="btn-zone">
      <button class="btn-marcacao" id="btnMarcacao">
        <span id="btnIcon">▶</span>
        <span id="btnLabel">ENTRADA</span>
        <span id="btnSublabel">Toca para registar entrada</span>
      </button>
      <div class="feedback" id="feedback"></div>
    </div>

    <div class="divider"></div>

    <!-- Histórico -->
    <div class="hist-section">
      <div class="hist-label">Esta semana</div>
      <div class="hist-lista" id="histLista">
        <div class="hist-vazio">A carregar…</div>
      </div>
    </div>

  </div><!-- /app-body -->
</div><!-- /ecrãPrincipal -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js" integrity="sha384-KX6Y/AMIv9qA8TLCDul2JatZWeyrJVgj3Xu/0r30Nr05xO8md1+wHAgtdsRV9LoE" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="config.js?v=2"></script>
<script src="app.js?v=2"></script>

<!-- Modal parecer saída -->
<div id="modalParecer" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:3000;align-items:flex-end;justify-content:center;padding:0">
    <div style="background:#1d2a37;border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:24px 24px calc(env(safe-area-inset-bottom,0px) + 24px)">
        <div style="font-family:'Oswald',sans-serif;font-size:16px;letter-spacing:1px;margin-bottom:6px;color:#d0a47f">Como correu o dia?</div>
        <div style="font-size:13px;color:rgba(255,255,255,.4);margin-bottom:16px">Opcional — o teu parecer ajuda a acompanhar o progresso da obra.</div>
        <textarea id="parecerTexto" rows="3" placeholder="Ex: Concluímos a primeira camada do capoto…"
            style="width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:12px;color:#fff;font-size:14px;font-family:'DM Sans',sans-serif;resize:none;outline:none"></textarea>
        <div style="display:flex;gap:10px;margin-top:14px">
            <button onclick="submeterParecer(false)" style="flex:1;background:rgba(255,255,255,.08);border:none;border-radius:10px;padding:12px;color:rgba(255,255,255,.6);font-size:14px;cursor:pointer">Ignorar</button>
            <button onclick="submeterParecer(true)" style="flex:1;background:#b58863;border:none;border-radius:10px;padding:12px;color:#fff;font-size:14px;font-weight:700;cursor:pointer">Confirmar ✓</button>
        </div>
    </div>
</div>
<script>
// Parecer na saída.
// Este código estava fora de um <script>: aparecia como texto no fundo da
// página e mostrarModalParecer() não existia. A janela continua desligada
// (ver a chamada comentada em confirmarMarcacao) porque o telemóvel do
// colaborador não tem permissão para alterar linhas da tabela ponto, por
// isso o parecer perdia-se sem aviso. Ligar só depois de haver uma função
// na base de dados que o grave.
let _ultimoRegistoId = null;

function mostrarModalParecer() {
    const modal = document.getElementById("modalParecer");
    if (modal) { modal.style.display = "flex"; document.getElementById("parecerTexto").value = ""; }
}

async function submeterParecer(guardar) {
    const modal = document.getElementById("modalParecer");
    if (modal) modal.style.display = "none";
    if (!guardar) return;
    const texto = document.getElementById("parecerTexto")?.value?.trim();
    if (!texto) return;
    // Buscar o último registo de ponto deste funcionário para guardar o parecer
    await SB.from("ponto").update({ parecer_saida: texto })
        .eq("funcionario_id", funcionario.id)
        .eq("tipo", "saida")
        .order("datahora", { ascending: false })
        .limit(1);
}
</script>

</body>
</html>
