<html lang="pt">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* =======================================================
   ASSISTENTE
   Pensado para o telemóvel: uma coluna de atalhos e a barra
   para falar com ele. Em ecrã grande, centrado e estreito.
   ======================================================= */
body { background: var(--bg); }

.hoje-folha {
    max-width: 460px;
    margin: 0 auto;
    min-height: 100vh;
    background: #fff;
    padding: 22px 20px 104px;
    box-shadow: var(--shadow);
}

.hoje-topo       { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom: 26px; }
.hoje-data       { font-size: 13px; color: var(--text-muted); }
.hoje-titulo     { font-family: var(--font-title); font-size: 30px; line-height:1.1; margin: 2px 0 0; }
.hoje-sino       { background:none; border:none; font-size:19px; cursor:pointer; opacity:.6; padding:4px; }
.hoje-ir {
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:50%;
    border:1px solid rgba(0,0,0,.12); background: rgba(0,0,0,.03);
    font-size:15px; text-decoration:none; color: var(--text-dark);
}
.hoje-ir:hover   { background: rgba(0,0,0,.07); }

.hoje-seccao     { font-size: 12px; color: var(--text-muted); margin: 22px 0 8px; }
.hoje-seccao:first-of-type { margin-top: 0; }

/* --- Atalhos (e a lista de obras, que usa o mesmo cartão) --- */
.hoje-alerta {
    display:flex; align-items:center; gap:12px;
    padding: 12px 2px; width:100%;
    background:none; border:none; border-top:1px solid rgba(0,0,0,.07);
    text-align:left; cursor:pointer; font: inherit; color: inherit;
}
.hoje-alerta:first-of-type { border-top:none; }
.hoje-alerta:hover { background: rgba(0,0,0,.02); }
.hoje-icone {
    width:38px; height:38px; border-radius:9px; flex-shrink:0; background: rgba(0,0,0,.05);
    display:flex; align-items:center; justify-content:center; font-size:17px;
}
.hoje-alerta-txt   { flex:1; min-width:0; }
.hoje-alerta-tit   { display:block; font-weight:600; font-size:15px; }
.hoje-alerta-sub   { display:block; font-size:12.5px; color: var(--text-muted); margin-top:1px; }
.hoje-conta        { color: var(--primary); }
.hoje-seta         { color: var(--text-muted); font-size:17px; flex-shrink:0; }

.hoje-vazio      { font-size:13px; color: var(--text-muted); padding: 6px 0 2px; line-height:1.5; }

/* --- Barra do assistente --- */
.hoje-barra-ia {
    position: fixed; bottom:0; left:0; right:0;
    display:flex; justify-content:center; padding: 12px 16px 16px;
    background: linear-gradient(to top, #fff 65%, rgba(255,255,255,0));
    pointer-events: none;
}
.hoje-barra-ia > div {
    pointer-events: auto;
    width: 100%; max-width: 420px;
    display:flex; align-items:center; gap:10px;
    background:#fff; border:1px solid rgba(0,0,0,.14);
    border-radius: 26px; padding: 9px 14px; box-shadow: var(--shadow);
}
.hoje-pedido { flex:1; border:none; outline:none; font: inherit; font-size:14px; background:none; color: var(--text-dark); }
.hoje-pedido::placeholder { color: var(--text-muted); }
.hoje-acao   { background:none; border:none; font-size:17px; cursor:pointer; opacity:.65; padding:2px 4px; }
.hoje-acao:hover { opacity:1; }

.hoje-aviso-ia {
    max-width:420px; margin: 0 auto 8px; pointer-events:auto;
    font-size:12px; color: var(--text-muted); text-align:center;
}

/* --- Painel (rascunho do pedido, lista por validar) --- */
.hoje-painel {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,.35);
    display: flex; align-items: flex-end; justify-content: center;
}
.hoje-painel-folha {
    background:#fff; width:100%; max-width:460px;
    border-radius: 16px 16px 0 0; padding: 18px 20px 20px;
    max-height: 88vh; overflow-y:auto; box-shadow: var(--shadow-lg);
}
.hoje-painel-topo {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 14px;
}
.hoje-painel-topo strong { font-size: 17px; }
.hoje-painel-accoes { display:flex; gap:10px; margin-top:18px; }
.hoje-painel-accoes button { flex:1; }

.hoje-campo       { margin-bottom: 12px; }
.hoje-campo label { display:block; font-size:11.5px; color: var(--text-muted); margin-bottom:4px; }
.hoje-campo textarea { resize: vertical; min-height: 70px; line-height: 1.5; font-family: inherit; }
.hoje-campo select, .hoje-campo input, .hoje-campo textarea {
    width:100%; padding:8px 10px; font: inherit; font-size:14px;
    border:1px solid rgba(0,0,0,.15); border-radius:8px;
    background:#fff; color: var(--text-dark);
}
.hoje-linha-pedido {
    border-top:1px solid rgba(0,0,0,.07); padding: 10px 0;
}
.hoje-linha-pedido:first-of-type { border-top:none; }
.hoje-linha-topo { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.hoje-linha-topo input[type="number"] { width:72px; text-align:right; }
.hoje-linha-topo input.un { width:62px; }
.hoje-linha-desc { font-weight:600; font-size:14px; flex:1; min-width:0; }
.hoje-conf {
    font-size:10.5px; font-weight:600; padding:2px 7px; border-radius:20px; white-space:nowrap;
}
.conf-alta  { background: rgba(79,122,99,.12);  color:#1f6b1f; }
.conf-media { background: rgba(0,0,0,.06);      color: var(--text-muted); }
.conf-baixa { background: rgba(181,136,99,.22); color:#8a5e06; }

.hoje-avisos {
    background: rgba(181,136,99,.12); border:1px solid rgba(181,136,99,.3);
    border-radius:8px; padding:8px 11px; font-size:12.5px; color:#8a5e06;
    margin-bottom:14px; line-height:1.5;
}

/* --- Tema escuro (o de arranque, como no resto da plataforma) --- */
body.dark {
    --text-dark:  #f0f0f0;
    --text-muted: rgba(255,255,255,.55);
}
body.dark .hoje-folha,
body.dark .hoje-painel-folha,
body.dark .hoje-barra-ia > div { background: #25363f; border-color: rgba(255,255,255,.1); }
body.dark .hoje-barra-ia { background: linear-gradient(to top, #1c2b3a 65%, rgba(28,43,58,0)); }
body.dark .hoje-ir     { border-color: rgba(255,255,255,.14); background: rgba(255,255,255,.05); }
body.dark .hoje-ir:hover, body.dark .hoje-alerta:hover { background: rgba(255,255,255,.06); }
body.dark .hoje-icone  { background: rgba(255,255,255,.08); }
body.dark .hoje-pedido { background: none; }
body.dark .hoje-alerta,
body.dark .hoje-linha-pedido { border-top-color: rgba(255,255,255,.08); }
body.dark .hoje-campo select,
body.dark .hoje-campo input,
body.dark .hoje-campo textarea { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.14); }
body.dark .hoje-avisos { color: #e0b98f; }
body.dark .conf-alta   { color: #8fd18f; }
body.dark .conf-baixa  { color: #e0b98f; }
body.dark [style*="rgba(0,0,0,.06)"] { border-color: rgba(255,255,255,.08) !important; }

/* Login, igual ao resto da plataforma */
#hojeLogin { max-width: 320px; margin: 90px auto; text-align:center; }
#hojeLogin input { width:100%; margin-bottom:10px; }
</style>
</head>
<body>
<script>try{if(localStorage.getItem("tema")!=="claro")document.body.classList.add("dark")}catch(e){document.body.classList.add("dark")}</script>

<!-- Pedir entrada quando não há sessão -->
<div id="hojeLogin" style="display:none">
    <h2 style="font-family:var(--font-title)">Assistente</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:18px">Entra com a tua conta de administrador.</p>
    <input id="hojeEmail" type="email" placeholder="email" autocomplete="username">
    <input id="hojePass" type="password" placeholder="password" autocomplete="current-password">
    <button class="btn-primary" id="hojeEntrar" style="width:100%">Entrar</button>
    <div id="hojeMsg" style="margin-top:10px;font-size:13px;color:#a5483d"></div>
</div>

<!-- O ecrã -->
<div class="hoje-folha" id="hojeFolha" style="display:none">

    <div class="hoje-topo">
        <div>
            <div class="hoje-data" id="hojeData"></div>
            <h1 class="hoje-titulo">Assistente</h1>
        </div>
        <div style="display:flex;align-items:center;gap:4px">
            <a href="registo-admin.html" class="hoje-ir" title="Registo diário">📋</a>
            <a href="admin.html" class="hoje-ir" title="Painel administrativo">⚙</a>
        </div>
    </div>

    <div class="hoje-seccao">O que posso fazer por ti</div>
    <div id="hojeAtalhos"></div>

</div>

<div class="hoje-barra-ia" id="hojeBarraIA" style="display:none">
    <div>
        <input class="hoje-pedido" id="hojePedido" placeholder="Olá chefe, em que posso ajudar?">
        <button class="hoje-acao" id="hojeCamara" title="Ler fatura">📷</button>
        <button class="hoje-acao" id="hojeMic" title="Ditar" style="display:none">🎤</button>
        <button class="hoje-acao" id="hojeEnviar" title="Enviar" style="display:none">➤</button>
    </div>
</div>

<!-- Painel: rascunho de pedido, lista de pedidos por validar -->
<div class="hoje-painel" id="hojePainel" style="display:none">
    <div class="hoje-painel-folha">
        <div class="hoje-painel-topo">
            <strong id="hojePainelTitulo">—</strong>
            <button class="hoje-sino" id="hojePainelFechar" title="Fechar">×</button>
        </div>
        <div id="hojePainelCorpo"></div>
        <div class="hoje-painel-accoes" id="hojePainelAccoes"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js" integrity="sha384-KX6Y/AMIv9qA8TLCDul2JatZWeyrJVgj3Xu/0r30Nr05xO8md1+wHAgtdsRV9LoE" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="config.js?v=2"></script>
<script src="assistente.js?v=2"></script>
</body>
</html>
