<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://code.jquery.com https://cdn.datatables.net; style-src 'self' 'unsafe-inline' https://cdn.datatables.net https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://npyosbigynxmxdakcymg.supabase.co wss://npyosbigynxmxdakcymg.supabase.co; object-src 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cadastro de Dispositivo — Maia Solutions</title>

<link rel="stylesheet" href="style.css" />

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js" integrity="sha384-KX6Y/AMIv9qA8TLCDul2JatZWeyrJVgj3Xu/0r30Nr05xO8md1+wHAgtdsRV9LoE" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="config.js?v=2"></script>

<style>
/* ===================================================
   CADASTRO PAGE — DESIGN MAIA SOLUTIONS
   =================================================== */

.cadastro-container {
    max-width: 460px;
    margin: 40px auto;
    padding: 0 24px 32px;
}

.cadastro-header {
    text-align: center;
    margin-bottom: 28px;
}

.cadastro-header h2 {
    font-size: 22px;
    font-weight: 700;
}

.cadastro-form {
    background: var(--bg-panel);
    box-shadow: var(--shadow);
    border-radius: var(--radius);
    padding: 24px;
}

.cadastro-form label {
    font-size: 14px;
    margin-top: 14px;
    display: block;
    opacity: .85;
}

.cadastro-form input {
    width: 100%;
    margin-top: 8px;
    padding: 10px 12px;
    font-size: 14px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

.cadastro-form button {
    margin-top: 18px;
    width: 100%;
    font-size: 16px;
    padding: 10px;
    border-radius: var(--radius);
}

#msg {
    margin-top: 16px;
    text-align: center;
    font-size: 14px;
}

body.dark .cadastro-form {
    background: var(--bg-dark-panel);
    color: var(--text-light);
}

</style>
</head>

<body class="dark">

<div class="cadastro-container">

  <!-- CABEÇALHO -->
  <div class="cadastro-header">
    <h2>Registar Dispositivo</h2>
    <p>Associa este telemóvel à tua conta</p>
  </div>

  <!-- FORMULÁRIO -->
<form id="frmCadastro" class="cadastro-form">

    <p style="font-size:13px;opacity:.7;margin-bottom:16px;line-height:1.5">
        Introduza o código de inscrição que o administrador lhe deu.
        É usado uma única vez e expira em 48 horas.
    </p>

    <label>Código de Inscrição</label>
    <input id="codigo" placeholder="Ex.: K7M2PQR4" autocomplete="off"
           maxlength="8" inputmode="latin" autocapitalize="characters" spellcheck="false"
           style="text-transform:uppercase;letter-spacing:.18em;font-family:ui-monospace,monospace;text-align:center;font-size:20px" />

    <div id="deviceInfo" style="margin-top:10px;font-size:11px;opacity:.4"></div>

    <button class="btn-primary" type="submit" style="margin-top:20px">
        Associar Dispositivo
    </button>

    <div id="msg" style="margin-top:14px;font-size:13px;line-height:1.5"></div>

</form>

</div>

<script src="cadastro.js"></script>

</body>
</html>
