<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://npyosbigynxmxdakcymg.supabase.co; media-src https://npyosbigynxmxdakcymg.supabase.co; connect-src https://npyosbigynxmxdakcymg.supabase.co; object-src 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Área do cliente · Maia Solutions</title>
<link rel="icon" href="Logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<!--
  Área do cliente. O cliente abre cliente.html?t=<código>, o link fixo que
  recebeu por WhatsApp. Esta página não lê a base de dados: pede tudo à
  função area-cliente, que só devolve as obras do cliente e os documentos
  marcados "Visível ao cliente". A única coisa que o cliente pode enviar é a
  resposta a um orçamento (aceito / pedir alterações), que o Alcindo confirma.
-->
<style>
    :root {
        /* Paleta da plataforma: azul-noite e caramelo */
        --bg: #131c25; --topo: #0e151d; --card: #1d2a37; --linha: rgba(255,255,255,.07);
        --texto: #ece5de; --suave: #a79e9c; --primary: #d0a47f; --caramelo: #b58863;
        --ok: #8fbfa0; --aviso: #e0b07a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--texto); font: 15px/1.5 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    html { background: var(--bg); color-scheme: dark; }
    a { color: var(--primary); }
    header { background: var(--topo); border-bottom: 1px solid var(--linha); }
    .topo { display: flex; align-items: center; gap: 12px; padding: 14px 16px; max-width: 860px; margin: 0 auto; }
    .topo img { height: 40px; }
    .topo .marca { font-family: Oswald, sans-serif; font-size: 13px; color: var(--primary); }
    main { max-width: 860px; margin: 0 auto; padding: 20px 16px 48px; }
    h1 { font-family: Oswald, sans-serif; font-weight: 500; font-size: 24px; margin: 0 0 4px; }
    h2 { font-family: Oswald, sans-serif; font-weight: 400; font-size: 13px; color: var(--suave); margin: 22px 0 10px; }
    .sub { color: var(--suave); margin: 0 0 18px; }
    .obra { background: var(--card); border: 1px solid var(--linha); border-radius: 16px; padding: 18px; margin-bottom: 20px; }
    .obra-cab { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
    .obra-nome { font-family: Oswald, sans-serif; font-size: 20px; font-weight: 500; }
    .obra-local { color: var(--suave); font-size: 13px; }
    .selo { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
    .selo.curso { background: rgba(181,136,99,.2); color: var(--primary); }
    .selo.feita { background: rgba(143,191,160,.16); color: var(--ok); }
    .barra { height: 8px; background: rgba(255,255,255,.08); border-radius: 99px; overflow: hidden; margin: 14px 0 6px; }
    .barra > div { height: 100%; background: var(--caramelo); border-radius: 99px; }
    .contas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 4px; }
    .contas div { background: rgba(127,127,127,.08); border-radius: 10px; padding: 10px; text-align: center; }
    .contas span { display: block; font-size: 11px; color: var(--suave); }
    .contas b { display: block; font-size: 16px; margin-top: 2px; }
    .contas-nota { font-size: 12px; color: var(--suave); margin: 4px 0 0; }
    .meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--suave); flex-wrap: wrap; gap: 6px; }
    .doc { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--linha); text-decoration: none; color: inherit; }
    .doc:first-child { border-top: none; }
    .doc .ic { font-size: 20px; width: 28px; text-align: center; }
    .doc .tx { flex: 1; min-width: 0; }
    .doc .nm { font-weight: 600; word-break: break-word; }
    .doc .dt { font-size: 12px; color: var(--suave); }
    .doc .abrir { font-size: 13px; color: var(--primary); white-space: nowrap; }
    .estado { font-size: 12px; font-weight: 600; }
    .estado.ok { color: var(--ok); } .estado.pend { color: var(--aviso); }
    .fotos { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
    .fotos a { display: block; position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: #25363f; text-decoration: none; }
    .fotos img { width: 100%; height: 100%; object-fit: cover; display: block; }
    /* Foto que o telemóvel não consegue mostrar (ex.: HEIC no Android) */
    .fotos .sem-pre { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 8px; text-align: center; color: var(--suave); font-size: 12px; }
    .fotos .sem-pre b { font-size: 24px; font-weight: 400; }
    .fotos a.falhou img { display: none; }
    .fotos a.falhou .sem-pre { display: flex; }
    .fotos .vid { aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: #25363f; }
    .fotos video { width: 100%; height: 100%; object-fit: cover; display: block; background: #000; }
    .vazio { color: var(--suave); font-size: 14px; padding: 6px 0; }
    .centro { text-align: center; padding: 60px 16px; color: var(--suave); }
    .fases { list-style: none; margin: 0; padding: 0; }
    .fases li { display: flex; gap: 12px; padding: 8px 0; border-top: 1px solid var(--linha); align-items: flex-start; }
    .fases li:first-child { border-top: none; }
    .fases .ponto { width: 22px; height: 22px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 12px; margin-top: 1px; border: 2px solid var(--linha); color: var(--suave); }
    .fases .concluida .ponto { background: rgba(143,191,160,.18); border-color: var(--ok); color: var(--ok); }
    .fases .a_decorrer .ponto { border-color: var(--caramelo); }
    .fases .a_decorrer .ponto::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--caramelo); }
    .fases .nm { font-weight: 600; }
    .fases .por_fazer .nm { color: var(--suave); font-weight: 500; }
    .fases .dt { font-size: 12px; color: var(--suave); }
    details.auto { border-top: 1px solid var(--linha); padding: 10px 0; }
    details.auto:first-of-type { border-top: none; }
    details.auto summary { cursor: pointer; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; list-style: none; }
    details.auto summary::-webkit-details-marker { display: none; }
    details.auto summary .nm { font-weight: 600; }
    details.auto summary .nm::before { content: "▸ "; color: var(--primary); }
    details.auto[open] summary .nm::before { content: "▾ "; }
    details.auto table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
    details.auto td { padding: 4px 0; border-top: 1px solid var(--linha); vertical-align: top; }
    details.auto td.n { text-align: right; white-space: nowrap; padding-left: 10px; }
    details.auto tr.tot td { font-weight: 600; }
    details.auto .notas { font-size: 13px; color: var(--suave); margin-top: 8px; white-space: pre-wrap; }
    .diario .dia { padding: 8px 0; border-top: 1px solid var(--linha); font-size: 14px; }
    .diario .dia:first-child { border-top: none; }
    .diario .dt { font-size: 12px; color: var(--suave); text-transform: capitalize; }
    .diario .tx { white-space: pre-wrap; }
    .resp { padding: 0 0 12px 40px; }
    .resp .botoes { display: flex; gap: 8px; flex-wrap: wrap; }
    .resp button { font: inherit; font-size: 14px; font-weight: 600; border-radius: 10px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--caramelo); background: transparent; color: var(--primary); }
    .resp button.principal { background: var(--caramelo); color: #131c25; }
    .resp button:disabled { opacity: .5; cursor: default; }
    .resp .caixa { background: rgba(255,255,255,.04); border: 1px solid var(--linha); border-radius: 12px; padding: 12px; }
    .resp .caixa p { margin: 0 0 10px; font-size: 14px; }
    .resp textarea { width: 100%; min-height: 90px; font: inherit; font-size: 14px; color: var(--texto); background: var(--bg); border: 1px solid var(--linha); border-radius: 10px; padding: 10px; margin-bottom: 10px; resize: vertical; }
    .resp .erro { color: #e59a8f; font-size: 13px; margin-top: 8px; }
    .rodape { text-align: center; color: var(--suave); font-size: 12px; margin-top: 30px; }
    .doc.sem-link { cursor: default; } .doc.sem-link .abrir { color: var(--suave); }
    .aviso-links { background: rgba(224,176,122,.12); border: 1px solid rgba(224,176,122,.35); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 14px; }
    .aviso-links button { font: inherit; font-size: 13px; margin-left: 6px; background: none; border: none; color: var(--primary); text-decoration: underline; cursor: pointer; padding: 0; }
    /* Avanço por pacotes */
    .pacotes .zona { font-size: 12px; color: var(--suave); margin: 12px 0 4px; }
    .pacotes .zona:first-child { margin-top: 0; }
    .fases .fase-corpo { flex: 1; min-width: 0; }
    .fases .pacotes { margin-top: 4px; }
    .fases .pac { font-size: 13px; padding: 4px 0; grid-template-columns: 1fr 70px 40px; }
    .pac { display: grid; grid-template-columns: 1fr 90px 44px; gap: 10px; align-items: center; padding: 6px 0; font-size: 14px; }
    .pac .mini { height: 6px; background: rgba(255,255,255,.08); border-radius: 99px; overflow: hidden; }
    .pac .mini > div { height: 100%; background: var(--caramelo); }
    .pac.feito .mini > div { background: var(--ok); }
    .pac .pc { text-align: right; font-variant-numeric: tabular-nums; color: var(--suave); font-size: 13px; }
    .pac .atr { color: var(--aviso); font-size: 12px; }
    /* Trabalhos a mais e remates */
    .extra, .remate { border-top: 1px solid var(--linha); padding: 10px 0; }
    .extra:first-of-type, .remate:first-of-type { border-top: none; }
    .extra .cab, .remate .cab { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .extra .nm, .remate .nm { font-weight: 600; white-space: pre-wrap; }
    .extra .dt, .remate .dt { font-size: 13px; color: var(--suave); margin-top: 2px; }
    .extra .resp, .remate .resp { padding: 10px 0 0; }
    .extra input[type=text] { width: 100%; font: inherit; font-size: 14px; color: var(--texto); background: var(--bg); border: 1px solid var(--linha); border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; }
    .remate .fotos { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); margin-top: 8px; }
    .remate .fotos a { aspect-ratio: 4/3; }
    .remate .leg { position: absolute; left: 6px; bottom: 6px; font-size: 11px; background: rgba(0,0,0,.6); color: #fff; padding: 1px 6px; border-radius: 6px; }
    .remates-resumo { font-size: 14px; color: var(--suave); margin-bottom: 4px; }
    /* Novo esta semana: no topo até "Tomei conhecimento" ou 7 dias */
    .novos { background: rgba(181,136,99,.10); border: 1px solid rgba(208,164,127,.45); border-radius: 14px; padding: 14px 16px; margin: 18px 0 8px; }
    .novos h2 { margin-top: 0; }
    .novos .de-obra { font-size: 12px; color: var(--suave); margin: 12px 0 4px; }
    .novos .fotos { margin-top: 8px; }
    .novos .acoes { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    .novos .acoes button { font: inherit; font-size: 14px; font-weight: 600; border-radius: 10px; padding: 8px 16px; cursor: pointer; border: none; background: var(--caramelo); color: #131c25; }
    .novos .acoes button:disabled { opacity: .5; cursor: default; }
    .novos .acoes span { font-size: 12px; color: var(--suave); }
    .novos .erro { color: #e59a8f; font-size: 13px; }
    .pedidos .ped { border-top: 1px solid var(--linha); padding: 10px 0; font-size: 14px; }
    .pedidos .ped:first-child { border-top: none; }
    .pedidos .ped .cab { font-size: 12px; color: var(--suave); }
    .pedidos .ped .msg { white-space: pre-wrap; }
    .pedidos .ped .rsp { margin-top: 6px; padding: 8px 10px; border-left: 3px solid var(--caramelo); background: rgba(255,255,255,.03); white-space: pre-wrap; }
    .novo-pedido { margin-top: 10px; }
    .novo-pedido select, .novo-pedido textarea { width: 100%; font: inherit; font-size: 14px; color: var(--texto); background: var(--bg); border: 1px solid var(--linha); border-radius: 10px; padding: 10px; margin-bottom: 8px; }
    .novo-pedido textarea { min-height: 80px; resize: vertical; }
    .novo-pedido button { font: inherit; font-size: 14px; font-weight: 600; border-radius: 10px; padding: 8px 14px; cursor: pointer; border: none; background: var(--caramelo); color: #131c25; }
    .novo-pedido button:disabled { opacity: .5; }
    .novo-pedido .erro { color: #e59a8f; font-size: 13px; }
    .novo-pedido .ok { color: var(--ok); font-size: 13px; }
    .resp button.recusar { border-color: rgba(229,154,143,.6); color: #e59a8f; }
</style>

<body>
<header class="topo">
    <img src="Logo.png" alt="Maia Solutions">
    <span class="marca">Área do cliente</span>
</header>
<main id="conteudo">
    <div class="carregar" role="status">
        <div class="logo" aria-hidden="true">
            <img class="telhado" src="img/logo-telhado.webp" alt="">
            <img class="maia" src="img/logo-maia.webp" alt="">
            <img class="solutions" src="img/logo-solutions.webp" alt="">
        </div>
        <p>A carregar a sua obra…</p>
    </div>
</main>

<script src="curva.js?v=3"></script>
<script>
const FUNCAO = "https://npyosbigynxmxdakcymg.supabase.co/functions/v1/area-cliente";
const TOKEN  = new URLSearchParams(location.search).get("t") || "";

const esc = s => String(s ?? "").replace(/[&<>"']/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dataPT = d => d ? new Date(d + "T12:00:00").toLocaleDateString("pt-PT") : "";
const euros  = v => v == null ? "" : Number(v).toLocaleString("pt-PT", { style: "currency", currency: "EUR" });
// Só links do nosso armazenamento; nunca outro endereço vindo da resposta.
const urlSegura = u => typeof u === "string" && u.startsWith("https://npyosbigynxmxdakcymg.supabase.co/") ? u : "#";

function linhaDoc(d, icone, extra = "") {
    // Sem link (falhou ao gerar): não se mostra um botão que não abre nada
    if (urlSegura(d.url) === "#") return `<div class="doc sem-link">
        <span class="ic">${icone}</span>
        <span class="tx">
            <span class="nm">${esc(d.numero || d.nome)}</span>
            <span class="dt">${esc(dataPT(d.data))}${extra ? " · " + extra : ""}</span>
        </span>
        <span class="abrir">Indisponível</span>
    </div>`;
    return `<a class="doc" href="${esc(urlSegura(d.url))}" target="_blank" rel="noopener noreferrer">
        <span class="ic">${icone}</span>
        <span class="tx">
            <span class="nm">${esc(d.numero || d.nome)}</span>
            <span class="dt">${esc(dataPT(d.data))}${extra ? " · " + extra : ""}</span>
        </span>
        <span class="abrir">Abrir ›</span>
    </a>`;
}

function estadoOrcamento(d) {
    const est = d.estado_orcamento === "aceite" ? `<span class="estado ok">Aceite</span>`
        : d.estado_orcamento === "recusado" ? `<span class="estado">Recusado</span>`
        : d.resposta_pendente ? `<span class="estado pend">${d.resposta_pendente.resposta === "aceite"
            ? "Aceitou · a aguardar confirmação" : d.resposta_pendente.resposta === "recusa"
            ? "Recusou · a aguardar" : "Pediu alterações · a aguardar"}</span>`
        : d.estado_orcamento === "enviado" ? `<span class="estado pend">A aguardar a sua resposta</span>` : "";
    return [d.total != null ? euros(d.total) + " com IVA" : "", est].filter(Boolean).join(" · ");
}

// Botões por baixo de um orçamento à espera de resposta
function respostaOrcamento(d) {
    if (d.estado_orcamento !== "enviado" || d.resposta_pendente) return "";
    return `<div class="resp" data-doc="${esc(d.id)}" data-numero="${esc(d.numero || d.nome)}" data-total="${esc(d.total != null ? euros(d.total) : "")}">${BOTOES_RESPOSTA}</div>`;
}
const BOTOES_RESPOSTA = `<div class="botoes">
    <button type="button" class="principal" data-passo="aceitar">Aceito este orçamento</button>
    <button type="button" data-passo="alterar">Pedir alterações</button>
    <button type="button" class="recusar" data-passo="recusar">Recusar</button>
</div>`;

function caixaResposta(el, passo) {
    const num = esc(el.dataset.numero), total = esc(el.dataset.total);
    if (passo === "aceitar") {
        el.innerHTML = `<div class="caixa">
            <p>Confirma que aceita o orçamento <b>${num}</b>${total ? `, no valor de <b>${total}</b> com IVA` : ""}?
            A Maia Solutions entra em contacto consigo para confirmar e combinar os passos seguintes.</p>
            <div class="botoes">
                <button type="button" class="principal" data-passo="enviar-aceite">Sim, aceito</button>
                <button type="button" data-passo="voltar">Cancelar</button>
            </div></div>`;
    } else if (passo === "alterar") {
        el.innerHTML = `<div class="caixa">
            <p>O que gostaria de alterar no orçamento <b>${num}</b>?</p>
            <textarea maxlength="2000" placeholder="Ex.: retirar a pintura exterior, mudar o pavimento da cozinha…"></textarea>
            <div class="botoes">
                <button type="button" class="principal" data-passo="enviar-alteracoes">Enviar pedido</button>
                <button type="button" data-passo="voltar">Cancelar</button>
            </div></div>`;
        el.querySelector("textarea").focus();
    } else if (passo === "recusar") {
        el.innerHTML = `<div class="caixa">
            <p>Confirma que recusa o orçamento <b>${num}</b>? Se quiser, diga-nos porquê: ajuda-nos a fazer melhor.</p>
            <textarea maxlength="2000" placeholder="Motivo (opcional). Ex.: preço acima do previsto, adiámos a obra…"></textarea>
            <div class="botoes">
                <button type="button" class="principal" data-passo="enviar-recusa">Sim, recuso</button>
                <button type="button" data-passo="voltar">Cancelar</button>
            </div></div>`;
        el.querySelector("textarea").focus();
    }
}

async function enviarResposta(el, tipo) {
    const comentario = tipo !== "aceite" ? (el.querySelector("textarea")?.value.trim() || "") : "";
    const avisar = msg => {
        el.querySelector(".erro")?.remove();
        el.querySelector(".caixa").insertAdjacentHTML("beforeend", `<div class="erro">${esc(msg)}</div>`);
    };
    if (tipo === "alteracoes" && !comentario) return avisar("Escreva o que gostaria de alterar.");
    el.querySelectorAll("button").forEach(b => b.disabled = true);
    try {
        const r = await fetch(FUNCAO, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: TOKEN, acao: "responder_orcamento", documento_id: el.dataset.doc, resposta: tipo, comentario }),
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.erro || "Erro " + r.status);
        await iniciar();
    } catch (e) {
        el.querySelectorAll("button").forEach(b => b.disabled = false);
        avisar(e.message);
    }
}

document.addEventListener("click", e => {
    const b = e.target.closest(".resp button");
    if (!b || b.closest(".extra, .remate")) return;   // têm os seus próprios botões
    const el = b.closest(".resp"), passo = b.dataset.passo;
    if (passo === "enviar-aceite") enviarResposta(el, "aceite");
    else if (passo === "enviar-alteracoes") enviarResposta(el, "alteracoes");
    else if (passo === "enviar-recusa") enviarResposta(el, "recusa");
    else if (passo === "voltar") el.innerHTML = BOTOES_RESPOSTA;
    else caixaResposta(el, passo);
});

// Fases da obra, cada uma com a sua % e os seus pacotes por baixo
function htmlFases(fases, pacotes = []) {
    if (!fases.length) return "";
    const icone = { concluida: "✓", a_decorrer: "", por_fazer: "" };
    const quando = f => f.estado === "concluida"
        ? (f.data_fim ? "Concluída · " + dataPT(f.data_fim) : "Concluída")
        : [f.data_inicio ? (f.estado === "a_decorrer" ? "Começou a " : "Início previsto: ") + dataPT(f.data_inicio) : "",
           f.data_fim ? "Fim previsto: " + dataPT(f.data_fim) : ""].filter(Boolean).join(" · ");
    return `<h2>Andamento</h2><ul class="fases">${fases.map(f => `<li class="${esc(f.estado)}">
        <span class="ponto">${icone[f.estado] || ""}</span>
        <span class="fase-corpo"><span class="nm">${esc(f.nome)}</span>${f.percentagem != null && f.estado !== "concluida"
            ? ` <span class="dt">· ${esc(f.percentagem)}%</span>` : ""}${quando(f) ? `<br><span class="dt">${esc(quando(f))}</span>` : ""}
            ${htmlListaPacotes(pacotes.filter(p => p.fase_id && p.fase_id === f.id), false)}</span>
    </li>`).join("")}</ul>`;
}

function htmlAutos(autos) {
    if (!autos.length) return "";
    return `<h2>Autos de medição</h2>${autos.slice().reverse().map(a => `<details class="auto">
        <summary><span class="nm">Auto nº ${esc(a.numero)} · ${esc(dataPT(a.data))}</span><span>${euros(a.total)} com IVA</span></summary>
        <table>
            ${a.linhas.map(l => `<tr><td>${esc(l.servico)}</td><td class="n">${esc(l.percentagem)}% feito</td><td class="n">${euros(l.valor)}</td></tr>`).join("")}
            <tr><td colspan="2" class="n">Total sem IVA</td><td class="n">${euros(a.total_sem_iva)}</td></tr>
            <tr><td colspan="2" class="n">IVA ${esc(a.taxa_iva)}%</td><td class="n">${euros(a.iva)}</td></tr>
            <tr class="tot"><td colspan="2" class="n">Total</td><td class="n">${euros(a.total)}</td></tr>
        </table>
        ${a.notas ? `<div class="notas">${esc(a.notas)}</div>` : ""}
    </details>`).join("")}`;
}

// Avanço por pacotes: a % de cada parte da obra, agrupada por zona. Os
// pacotes que pertencem a uma fase aparecem dentro dela (htmlFases); aqui
// ficam só os outros.
function htmlPacotes(pacotes, fases) {
    const idsFases = new Set(fases.map(f => f.id).filter(Boolean));
    const soltos = pacotes.filter(p => !p.fase_id || !idsFases.has(p.fase_id));
    if (!soltos.length) return "";
    return `<h2>${soltos.length < pacotes.length ? "Outros trabalhos" : "Avanço por zona"}</h2>${htmlListaPacotes(soltos, true)}`;
}

function htmlListaPacotes(pacotes, comZonas) {
    if (!pacotes.length) return "";
    let zonaAnt = null;
    const variasZonas = comZonas && (new Set(pacotes.map(p => p.zona)).size > 1 || pacotes[0].zona);
    return `<div class="pacotes">${pacotes.map(p => {
        const tit = variasZonas && p.zona !== zonaAnt ? `<div class="zona">${esc(p.zona || "Geral")}</div>` : "";
        zonaAnt = p.zona;
        return `${tit}<div class="pac${p.percentagem >= 100 ? " feito" : ""}">
            <span>${esc(p.nome)}${p.atrasado ? ` <span class="atr">· atrasado</span>` : ""}</span>
            <span class="mini"><div style="width:${Number(p.percentagem) || 0}%"></div></span>
            <span class="pc">${p.percentagem >= 100 ? "✓" : esc(p.percentagem) + "%"}</span>
        </div>`;
    }).join("")}</div>`;
}

const ehVideoDoc = d => /^video\//i.test(d.mime || "");

function htmlFoto(d) {
    if (ehVideoDoc(d)) return `<div class="vid" title="${esc(d.nome)}">
        <video src="${esc(urlSegura(d.url))}" controls playsinline preload="metadata" aria-label="Vídeo da obra"></video></div>`;
    return `<a href="${esc(urlSegura(d.url))}" target="_blank" rel="noopener noreferrer" title="${esc(d.nome)}">
        <img src="${esc(urlSegura(d.url))}" alt="Fotografia da obra" loading="lazy" onerror="this.parentNode.classList.add('falhou')">
        <span class="sem-pre"><b>📷</b>Abrir fotografia</span></a>`;
}

// Pedidos ao Alcindo: os já feitos, com a resposta, e o formulário para um novo
const TIPO_PEDIDO = { informacao: "Pedido de informação", extra: "Trabalho extra", reclamacao: "Reclamação", sugestao: "Sugestão" };
function htmlPedidos(obraId, pedidos) {
    const quando = d => new Date(d).toLocaleDateString("pt-PT");
    return `<h2>Pedidos e mensagens</h2><div class="pedidos">${pedidos.map(p => `<div class="ped">
        <div class="cab">${esc(TIPO_PEDIDO[p.tipo] || "Pedido")} · ${esc(quando(p.created_at))} · ${p.resposta ? "Respondido" : p.estado === "fechado" ? "Tratado" : "Aguarda resposta"}</div>
        <div class="msg">${esc(p.mensagem)}</div>
        ${p.resposta ? `<div class="rsp">${esc(p.resposta)}</div>` : ""}
    </div>`).join("")}</div>
    <form class="novo-pedido" data-obra="${esc(obraId)}">
        <select name="tipo" aria-label="Tipo de pedido">
            <option value="">Que tipo de pedido?</option>
            ${Object.entries(TIPO_PEDIDO).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}
        </select>
        <textarea name="mensagem" maxlength="2000" placeholder="Escreva aqui a sua mensagem para a Maia Solutions."></textarea>
        <button type="submit">Enviar pedido</button>
        <div class="estado-envio"></div>
    </form>`;
}

document.addEventListener("submit", async e => {
    const f = e.target.closest(".novo-pedido");
    if (!f) return;
    e.preventDefault();
    const est = f.querySelector(".estado-envio"), btn = f.querySelector("button");
    const tipo = f.tipo.value, mensagem = f.mensagem.value.trim();
    const aviso = (t, cls = "erro") => { est.className = "estado-envio " + cls; est.textContent = t; };
    if (!tipo) return aviso("Escolha o tipo de pedido.");
    if (!mensagem) return aviso("Escreva o seu pedido.");
    btn.disabled = true;
    try {
        const r = await fetch(FUNCAO, { method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: TOKEN, acao: "pedido", obra_id: f.dataset.obra, tipo, mensagem }) });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.erro || "Erro " + r.status);
        await iniciar();
    } catch (err) {
        btn.disabled = false;
        aviso(err.message);
    }
});

function htmlDiario(notas) {
    if (!notas.length) return "";
    const dia = d => new Date(d + "T12:00:00").toLocaleDateString("pt-PT", { weekday: "long", day: "numeric", month: "long" });
    return `<h2>Diário da obra</h2><div class="diario">${notas.map(n => `<div class="dia">
        <div class="dt">${esc(dia(n.data))}</div><div class="tx">${esc(n.notas)}</div></div>`).join("")}</div>`;
}

function htmlContas(c) {
    if (!c) return "";
    return `<div class="contas">
        <div><span>Valor da obra</span><b>${euros(c.valor)}</b></div>
        <div><span>Já pago</span><b>${euros(c.pago)}</b></div>
        <div><span>Falta pagar</span><b>${euros(c.falta)}</b></div>
    </div><p class="contas-nota">Valores sem IVA.</p>`;
}

function seccao(titulo, itens, vazio) {
    return `<h2>${titulo}</h2>${itens.length ? itens.join("") : `<div class="vazio">${vazio}</div>`}`;
}

// Uma linha de documento tal como aparece na sua secção (orçamento com os
// botões de resposta, fatura com o estado do pagamento…)
function linhaDocumento(d) {
    if (d.tipo === "orcamento") return linhaDoc(d, "🧾", estadoOrcamento(d)) + respostaOrcamento(d);
    if (d.tipo === "recibo") return linhaDoc(d, "✅", "Recibo");
    if (d.tipo === "fatura") return linhaDoc(d, "💶", [euros(d.total),
        d.paga == null ? "" : d.paga ? `<span class="estado ok">Paga</span>`
            : d.recebido ? `<span class="estado pend">Paga em parte: falta ${euros(Number(d.total) - Number(d.recebido))}</span>`
            : `<span class="estado pend">Por pagar</span>`]
        .filter(Boolean).join(" · "));
    return linhaDoc(d, "📄");
}

// No topo da página: os documentos, fotos e vídeos que ficaram visíveis há
// menos de 7 dias e que o cliente ainda não deu como vistos. Ao carregar em
// "Tomei conhecimento" (ou passada a semana) voltam para a sua secção.
function htmlNovos(obras, docs) {
    const novos = docs.filter(d => d.novo);
    if (!novos.length) return "";
    const nomeObra = new Map(obras.map(o => [o.id, o.nome]));
    const porObra = obras.map(o => novos.filter(d => d.obra_id === o.id)).filter(l => l.length);
    const temVideo = novos.some(d => d.tipo === "foto" && ehVideoDoc(d));
    const temFoto  = novos.some(d => d.tipo === "foto");
    const temDoc   = novos.some(d => d.tipo !== "foto");
    const titulo = [temDoc ? "documentos" : "", temFoto ? (temVideo ? "fotos e vídeos" : "fotos") : ""].filter(Boolean).join(", ");
    return `<div class="novos">
        <h2>Novo esta semana: ${esc(titulo)}</h2>
        ${porObra.map(l => {
            const fotos = l.filter(d => d.tipo === "foto"), outros = l.filter(d => d.tipo !== "foto");
            return `${porObra.length > 1 || obras.length > 1 ? `<div class="de-obra">${esc(nomeObra.get(l[0].obra_id))}</div>` : ""}
                ${outros.map(linhaDocumento).join("")}
                ${fotos.length ? `<div class="fotos">${fotos.map(htmlFoto).join("")}</div>` : ""}`;
        }).join("")}
        <div class="acoes">
            <button type="button" id="btnTomeiConhecimento" data-ids="${esc(novos.map(d => d.id).join(","))}">Tomei conhecimento</button>
            <span>Passam para as secções habituais, mais abaixo.</span>
        </div>
    </div>`;
}

document.addEventListener("click", async e => {
    const b = e.target.closest("#btnTomeiConhecimento");
    if (!b) return;
    b.disabled = true;
    b.parentNode.querySelector(".erro")?.remove();
    try {
        const r = await fetch(FUNCAO, { method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: TOKEN, acao: "tomei_conhecimento", documentos: b.dataset.ids.split(",") }) });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.erro || "Erro " + r.status);
        await iniciar();
    } catch (err) {
        b.disabled = false;
        b.insertAdjacentHTML("afterend", `<span class="erro">${esc(err.message)}</span>`);
    }
});

// ── Trabalhos a mais ─────────────────────────────────────────
// Os enviados esperam pela resposta do cliente: aceitar (com o nome de quem
// aceita) ou recusar (com motivo opcional). Aceites e recusados ficam como
// registo, com a data.
const BOTOES_EXTRA = `<div class="botoes">
    <button type="button" class="principal" data-extra="aceitar">Aceito este trabalho</button>
    <button type="button" data-extra="recusar">Não quero</button></div>`;
function htmlExtras(extras) {
    if (!extras.length) return "";
    const quando = d => d ? new Date(d).toLocaleDateString("pt-PT") : "";
    const aceites = extras.filter(x => x.estado === "aceite");
    const somaAceites = aceites.reduce((t, x) => t + Number(x.valor_sem_iva || 0), 0);
    return `<h2>Trabalhos a mais</h2>${extras.map(x => `<div class="extra" data-extra-id="${esc(x.id)}">
        <div class="cab"><span class="nm">${esc(x.descricao)}</span><span>${euros(x.total)} com IVA</span></div>
        <div class="dt">${euros(x.valor_sem_iva)} + IVA ${esc(x.taxa_iva)}%${x.dias_prazo ? ` · acrescenta ${esc(x.dias_prazo)} dia${x.dias_prazo == 1 ? "" : "s"} ao prazo` : ""}</div>
        ${x.estado === "enviado" ? `<div class="resp">${BOTOES_EXTRA}</div>`
          : x.estado === "aceite" ? `<div class="dt"><span class="estado ok">Aceite</span> por ${esc(x.resposta_nome || "cliente")} a ${esc(quando(x.resposta_em))}</div>`
          : `<div class="dt"><span class="estado pend">Recusado</span> a ${esc(quando(x.resposta_em))}${x.motivo_recusa ? ` · ${esc(x.motivo_recusa)}` : ""}</div>`}
    </div>`).join("")}
    ${aceites.length ? `<p class="contas-nota">Trabalhos a mais aceites: ${euros(somaAceites)} sem IVA.</p>` : ""}`;
}

function caixaExtra(el, passo) {
    if (passo === "aceitar") {
        el.innerHTML = `<div class="caixa">
            <p>Para aceitar, escreva o seu nome. Fica registado com a data de hoje e o valor soma ao valor da obra.</p>
            <input type="text" maxlength="120" placeholder="O seu nome" autocomplete="name">
            <div class="botoes">
                <button type="button" class="principal" data-extra="enviar-aceite">Confirmo, aceito</button>
                <button type="button" data-extra="voltar">Cancelar</button>
            </div></div>`;
        el.querySelector("input").focus();
    } else if (passo === "recusar") {
        el.innerHTML = `<div class="caixa">
            <p>Confirma que não quer este trabalho? Se quiser, diga-nos porquê.</p>
            <textarea maxlength="2000" placeholder="Motivo (opcional)"></textarea>
            <div class="botoes">
                <button type="button" class="principal" data-extra="enviar-recusa">Sim, não quero</button>
                <button type="button" data-extra="voltar">Cancelar</button>
            </div></div>`;
        el.querySelector("textarea").focus();
    }
}

async function enviarRespostaExtra(el, tipo) {
    const id = el.closest(".extra").dataset.extraId;
    const nome = el.querySelector("input")?.value.trim() || "";
    const comentario = el.querySelector("textarea")?.value.trim() || "";
    const avisar = msg => {
        el.querySelector(".erro")?.remove();
        el.querySelector(".caixa").insertAdjacentHTML("beforeend", `<div class="erro">${esc(msg)}</div>`);
    };
    if (tipo === "aceite" && nome.length < 2) return avisar("Escreva o seu nome para aceitar.");
    el.querySelectorAll("button").forEach(b => b.disabled = true);
    try {
        const r = await fetch(FUNCAO, { method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: TOKEN, acao: "responder_extra", extra_id: id, resposta: tipo, nome, comentario }) });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.erro || "Erro " + r.status);
        await iniciar();
    } catch (e) {
        el.querySelectorAll("button").forEach(b => b.disabled = false);
        avisar(e.message);
    }
}

document.addEventListener("click", e => {
    const b = e.target.closest(".extra .resp button");
    if (!b) return;
    const el = b.closest(".resp"), passo = b.dataset.extra;
    if (passo === "enviar-aceite") enviarRespostaExtra(el, "aceite");
    else if (passo === "enviar-recusa") enviarRespostaExtra(el, "recusa");
    else if (passo === "voltar") el.innerHTML = BOTOES_EXTRA;
    else caixaExtra(el, passo);
});

// ── Remates (vistoria final) ─────────────────────────────────
// O que ficou por acertar, divisão a divisão. Os resolvidos pedem ao cliente
// que confirme que ficou bem; se não ficou, faz um pedido (reclamação).
function htmlRemates(remates) {
    if (!remates.length) return "";
    const quando = d => d ? dataPT(String(d).slice(0, 10)) : "";
    const abertos = remates.filter(r => r.estado === "aberto").length;
    const porConfirmar = remates.filter(r => r.estado === "resolvido" && !r.cliente_confirmou_em).length;
    const foto = (url, leg) => url ? `<a href="${esc(urlSegura(url))}" target="_blank" rel="noopener noreferrer">
        <img src="${esc(urlSegura(url))}" alt="${leg}" loading="lazy" onerror="this.parentNode.classList.add('falhou')">
        <span class="sem-pre"><b>📷</b>Abrir</span><span class="leg">${leg}</span></a>` : "";
    return `<h2>Remates</h2>
    <div class="remates-resumo">${abertos ? `${abertos} por resolver` : "Todos resolvidos"}${porConfirmar ? ` · ${porConfirmar} à espera da sua confirmação` : ""}</div>
    ${remates.map(r => `<div class="remate" data-remate-id="${esc(r.id)}">
        <div class="cab"><span class="nm">${r.divisao ? esc(r.divisao) + " · " : ""}${esc(r.descricao)}</span>
            ${r.estado === "aberto" ? `<span class="estado pend">Por resolver</span>` : `<span class="estado ok">Resolvido</span>`}</div>
        <div class="dt">${r.estado === "aberto" ? (r.prazo ? "Prazo: " + esc(quando(r.prazo)) : "")
            : [r.resolvido_em ? "Resolvido a " + esc(quando(r.resolvido_em)) : "", r.cliente_confirmou_em ? "confirmado por si a " + esc(quando(r.cliente_confirmou_em)) : ""].filter(Boolean).join(" · ")}</div>
        ${r.foto_antes || r.foto_depois ? `<div class="fotos">${foto(r.foto_antes, "Antes")}${foto(r.foto_depois, "Depois")}</div>` : ""}
        ${r.estado === "resolvido" && !r.cliente_confirmou_em ? `<div class="resp"><div class="botoes">
            <button type="button" class="principal" data-remate="confirmar">Confirmo que ficou bem</button></div>
            <div class="dt">Se não ficou bem, diga-nos em «Pedidos e mensagens», mais abaixo.</div></div>` : ""}
    </div>`).join("")}`;
}

document.addEventListener("click", async e => {
    const b = e.target.closest(".remate .resp button[data-remate]");
    if (!b) return;
    const el = b.closest(".resp");
    b.disabled = true;
    el.querySelector(".erro")?.remove();
    try {
        const r = await fetch(FUNCAO, { method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: TOKEN, acao: "confirmar_remate", remate_id: b.closest(".remate").dataset.remateId }) });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.erro || "Erro " + r.status);
        await iniciar();
    } catch (err) {
        b.disabled = false;
        el.insertAdjacentHTML("beforeend", `<div class="erro">${esc(err.message)}</div>`);
    }
});

function htmlObra(o, docs, fases, autos, diario, pacotes, pedidos, novosPorTipo = {}, extras = [], remates = []) {
    // % pelos pacotes de trabalho (cada um pesado pelo valor, calculada no
    // servidor); sem pacotes, a % escrita na obra; sem ela, as fases
    // (concluídas contam inteiras, as a decorrer metade). Sem nada, não há barra.
    let pct = null;
    if (o.avanco != null) pct = Math.max(0, Math.min(100, Number(o.avanco) || 0));
    else if (o.percentagem_conclusao != null) pct = Math.max(0, Math.min(100, Number(o.percentagem_conclusao) || 0));
    else if (fases.length) pct = Math.round(fases.reduce((s, f) => s + (f.estado === "concluida" ? 1 : f.estado === "a_decorrer" ? .5 : 0), 0) / fases.length * 100);
    const feita = o.estado === "concluida";
    if (feita) pct = 100;
    const de = t => docs.filter(d => d.tipo === t);

    const orcs = de("orcamento").map(linhaDocumento);
    const fats = [...de("fatura"), ...de("recibo")]
        .sort((a, b) => String(b.data).localeCompare(String(a.data)))
        .map(linhaDocumento);
    const fotos = de("foto").map(htmlFoto);
    const outros = de("outro").map(linhaDocumento);
    // Se os únicos desta secção estão em "Novo esta semana", não se diz "ainda não há"
    const vazioSe = (tipos, txt) => tipos.some(t => novosPorTipo[t]) ? "Está em «Novo esta semana», no topo." : txt;

    return `<section class="obra">
        <div class="obra-cab">
            <div>
                <div class="obra-nome">${esc(o.nome)}</div>
                ${o.local ? `<div class="obra-local">${esc(o.local)}</div>` : ""}
            </div>
            <span class="selo ${feita ? "feita" : "curso"}">${feita ? "✓ Concluída" : "Em curso"}</span>
        </div>
        ${pct != null ? `<div class="barra"><div style="width:${pct}%"></div></div>` : ""}
        <div class="meta">
            ${pct != null ? `<span>${pct}% concluída</span>` : ""}
            ${o.data_conclusao_prevista && !feita ? `<span>Conclusão prevista: ${esc(dataPT(o.data_conclusao_prevista))}</span>` : ""}
        </div>
        ${htmlContas(o.contas)}
        ${o.curva ? `<h2>Feito vs previsto</h2>${htmlCurva(o.curva)}` : ""}
        ${htmlFases(fases, pacotes)}
        ${htmlPacotes(pacotes, fases)}
        ${htmlExtras(extras)}
        ${htmlRemates(remates)}
        ${htmlDiario(diario)}
        ${seccao("Orçamentos", orcs, vazioSe(["orcamento"], "Ainda não há orçamentos."))}
        ${htmlAutos(autos)}
        ${seccao("Faturas e recibos", fats, vazioSe(["fatura", "recibo"], "Ainda não há faturas."))}
        ${fotos.length ? `<h2>${de("foto").some(ehVideoDoc) ? "Fotografias e vídeos" : "Fotografias"}</h2><div class="fotos">${fotos.join("")}</div>` : ""}
        ${outros.length ? seccao("Outros documentos", outros, "") : ""}
        ${pedidos ? htmlPedidos(o.id, pedidos) : ""}
    </section>`;
}

async function iniciar() {
    const el = document.getElementById("conteudo");
    if (!TOKEN) {
        el.innerHTML = `<div class="centro">Este link não está completo.<br>Abra o link que recebeu da Maia Solutions.</div>`;
        return;
    }
    try {
        const r = await fetch(FUNCAO, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: TOKEN }),
        });
        const j = await r.json();
        if (!r.ok) throw new Error(j.erro || "Erro " + r.status);

        const obras = j.obras || [], docs = j.documentos || [];
        const primeiro = String(j.cliente?.nome || "").trim().split(/\s+/)[0];
        el.innerHTML = `
            <h1>Olá${primeiro ? ", " + esc(primeiro) : ""}</h1>
            <p class="sub">Aqui pode acompanhar ${obras.length === 1 ? "a sua obra" : "as suas obras"} e consultar os documentos.</p>
            ${j.links_falharam ? `<div class="aviso-links">Alguns documentos não abriram desta vez.<button type="button" onclick="location.reload()">Atualizar a página</button></div>` : ""}
            ${htmlNovos(obras, docs)}
            ${obras.length
                ? obras.map(o => htmlObra(o, docs.filter(d => d.obra_id === o.id && !d.novo),
                    (j.fases || []).filter(f => f.obra_id === o.id), (j.autos || []).filter(a => a.obra_id === o.id),
                    (j.diario || []).filter(n => n.obra_id === o.id), (j.pacotes || []).filter(p => p.obra_id === o.id),
                    j.pedidos ? j.pedidos.filter(p => p.obra_id === o.id) : null,
                    Object.fromEntries(docs.filter(d => d.obra_id === o.id && d.novo).map(d => [d.tipo, true])),
                    (j.extras || []).filter(x => x.obra_id === o.id), (j.remates || []).filter(x => x.obra_id === o.id))).join("")
                : `<div class="centro">Ainda não há obras associadas.</div>`}
            <div class="rodape">Os links dos documentos valem 1 hora. Se algum não abrir, atualize a página.<br>Maia Solutions</div>`;
    } catch (e) {
        el.innerHTML = `<div class="centro">Não foi possível abrir a Área do cliente.<br>${esc(e.message)}<br><br>Se o problema continuar, contacte a Maia Solutions.</div>`;
    }
}
iniciar();
</script>
