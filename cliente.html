<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://npyosbigynxmxdakcymg.supabase.co; connect-src https://npyosbigynxmxdakcymg.supabase.co; object-src 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Área do cliente · Maia Solutions</title>
<link rel="icon" href="Logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<!--
  Área do cliente. O cliente abre cliente.html?t=<código>, o link fixo que
  recebeu por WhatsApp. Esta página não lê a base de dados: pede tudo à
  função area-cliente, que só devolve as obras do cliente e os documentos
  marcados "Visível ao cliente". A única coisa que o cliente pode enviar é a
  resposta a um orçamento (aceito / pedir alterações), que o Alcindo confirma.
-->
<style>
    :root {
        /* Paleta da plataforma: azul-noite e caramelo */
        --bg: #131c25; --topo: #0e151d; --card: #1d2a37; --linha: rgba(255,255,255,.07);
        --texto: #ece5de; --suave: #a79e9c; --primary: #d0a47f; --caramelo: #b58863;
        --ok: #8fbfa0; --aviso: #e0b07a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--texto); font: 15px/1.5 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    html { background: var(--bg); color-scheme: dark; }
    a { color: var(--primary); }
    header { background: var(--topo); border-bottom: 1px solid var(--linha); }
    .topo { display: flex; align-items: center; gap: 12px; padding: 14px 16px; max-width: 860px; margin: 0 auto; }
    .topo img { height: 40px; }
    .topo .marca { font-family: Oswald, sans-serif; letter-spacing: 1px; text-transform: uppercase; font-size: 13px; color: var(--primary); }
    main { max-width: 860px; margin: 0 auto; padding: 20px 16px 48px; }
    h1 { font-family: Oswald, sans-serif; font-weight: 500; font-size: 26px; margin: 0 0 4px; }
    h2 { font-family: Oswald, sans-serif; font-weight: 400; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--suave); margin: 22px 0 10px; }
    .sub { color: var(--suave); margin: 0 0 18px; }
    .obra { background: var(--card); border: 1px solid var(--linha); border-radius: 16px; padding: 18px; margin-bottom: 20px; }
    .obra-cab { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
    .obra-nome { font-family: Oswald, sans-serif; font-size: 21px; font-weight: 500; }
    .obra-local { color: var(--suave); font-size: 13px; }
    .selo { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
    .selo.curso { background: rgba(181,136,99,.2); color: var(--primary); }
    .selo.feita { background: rgba(143,191,160,.16); color: var(--ok); }
    .barra { height: 8px; background: rgba(255,255,255,.08); border-radius: 99px; overflow: hidden; margin: 14px 0 6px; }
    .barra > div { height: 100%; background: var(--caramelo); border-radius: 99px; }
    .contas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 4px; }
    .contas div { background: rgba(127,127,127,.08); border-radius: 10px; padding: 10px; text-align: center; }
    .contas span { display: block; font-size: 11px; color: var(--suave); text-transform: uppercase; letter-spacing: .5px; }
    .contas b { display: block; font-size: 15px; margin-top: 2px; }
    .contas-nota { font-size: 12px; color: var(--suave); margin: 4px 0 0; }
    .meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--suave); flex-wrap: wrap; gap: 6px; }
    .doc { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--linha); text-decoration: none; color: inherit; }
    .doc:first-child { border-top: none; }
    .doc .ic { font-size: 22px; width: 28px; text-align: center; }
    .doc .tx { flex: 1; min-width: 0; }
    .doc .nm { font-weight: 600; word-break: break-word; }
    .doc .dt { font-size: 12px; color: var(--suave); }
    .doc .abrir { font-size: 13px; color: var(--primary); white-space: nowrap; }
    .estado { font-size: 12px; font-weight: 600; }
    .estado.ok { color: var(--ok); } .estado.pend { color: var(--aviso); }
    .fotos { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
    .fotos a { display: block; position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: #25363f; text-decoration: none; }
    .fotos img { width: 100%; height: 100%; object-fit: cover; display: block; }
    /* Foto que o telemóvel não consegue mostrar (ex.: HEIC no Android) */
    .fotos .sem-pre { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 8px; text-align: center; color: var(--suave); font-size: 12px; }
    .fotos .sem-pre b { font-size: 26px; font-weight: 400; }
    .fotos a.falhou img { display: none; }
    .fotos a.falhou .sem-pre { display: flex; }
    .vazio { color: var(--suave); font-size: 14px; padding: 6px 0; }
    .centro { text-align: center; padding: 60px 16px; color: var(--suave); }
    .fases { list-style: none; margin: 0; padding: 0; }
    .fases li { display: flex; gap: 12px; padding: 8px 0; border-top: 1px solid var(--linha); align-items: flex-start; }
    .fases li:first-child { border-top: none; }
    .fases .ponto { width: 22px; height: 22px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 12px; margin-top: 1px; border: 2px solid var(--linha); color: var(--suave); }
    .fases .concluida .ponto { background: rgba(143,191,160,.18); border-color: var(--ok); color: var(--ok); }
    .fases .a_decorrer .ponto { border-color: var(--caramelo); }
    .fases .a_decorrer .ponto::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--caramelo); }
    .fases .nm { font-weight: 600; }
    .fases .por_fazer .nm { color: var(--suave); font-weight: 500; }
    .fases .dt { font-size: 12px; color: var(--suave); }
    details.auto { border-top: 1px solid var(--linha); padding: 10px 0; }
    details.auto:first-of-type { border-top: none; }
    details.auto summary { cursor: pointer; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; list-style: none; }
    details.auto summary::-webkit-details-marker { display: none; }
    details.auto summary .nm { font-weight: 600; }
    details.auto summary .nm::before { content: "▸ "; color: var(--primary); }
    details.auto[open] summary .nm::before { content: "▾ "; }
    details.auto table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
    details.auto td { padding: 5px 0; border-top: 1px solid var(--linha); vertical-align: top; }
    details.auto td.n { text-align: right; white-space: nowrap; padding-left: 10px; }
    details.auto tr.tot td { font-weight: 600; }
    details.auto .notas { font-size: 13px; color: var(--suave); margin-top: 8px; white-space: pre-wrap; }
    .diario .dia { padding: 8px 0; border-top: 1px solid var(--linha); font-size: 14px; }
    .diario .dia:first-child { border-top: none; }
    .diario .dt { font-size: 12px; color: var(--suave); text-transform: capitalize; }
    .diario .tx { white-space: pre-wrap; }
    .resp { padding: 0 0 12px 40px; }
    .resp .botoes { display: flex; gap: 8px; flex-wrap: wrap; }
    .resp button { font: inherit; font-size: 14px; font-weight: 600; border-radius: 10px; padding: 9px 14px; cursor: pointer; border: 1px solid var(--caramelo); background: transparent; color: var(--primary); }
    .resp button.principal { background: var(--caramelo); color: #131c25; }
    .resp button:disabled { opacity: .5; cursor: default; }
    .resp .caixa { background: rgba(255,255,255,.04); border: 1px solid var(--linha); border-radius: 12px; padding: 12px; }
    .resp .caixa p { margin: 0 0 10px; font-size: 14px; }
    .resp textarea { width: 100%; min-height: 90px; font: inherit; font-size: 14px; color: var(--texto); background: var(--bg); border: 1px solid var(--linha); border-radius: 10px; padding: 10px; margin-bottom: 10px; resize: vertical; }
    .resp .erro { color: #e59a8f; font-size: 13px; margin-top: 8px; }
    .rodape { text-align: center; color: var(--suave); font-size: 12px; margin-top: 30px; }
    .doc.sem-link { cursor: default; } .doc.sem-link .abrir { color: var(--suave); }
    .aviso-links { background: rgba(224,176,122,.12); border: 1px solid rgba(224,176,122,.35); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; margin-bottom: 14px; }
    .aviso-links button { font: inherit; font-size: 13px; margin-left: 6px; background: none; border: none; color: var(--primary); text-decoration: underline; cursor: pointer; padding: 0; }
    /* Avanço por pacotes e corte da semana */
    .pacotes .zona { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--suave); margin: 12px 0 4px; }
    .pacotes .zona:first-child { margin-top: 0; }
    .pac { display: grid; grid-template-columns: 1fr 90px 44px; gap: 10px; align-items: center; padding: 6px 0; font-size: 14px; }
    .pac .mini { height: 6px; background: rgba(255,255,255,.08); border-radius: 99px; overflow: hidden; }
    .pac .mini > div { height: 100%; background: var(--caramelo); }
    .pac.feito .mini > div { background: var(--ok); }
    .pac .pc { text-align: right; font-variant-numeric: tabular-nums; color: var(--suave); font-size: 13px; }
    .pac .atr { color: var(--aviso); font-size: 12px; }
    .semana { background: rgba(255,255,255,.04); border: 1px solid var(--linha); border-radius: 12px; padding: 12px 14px; }
    .semana ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; }
    .semana .fotos { margin-top: 10px; }
    .resp button.recusar { border-color: rgba(229,154,143,.6); color: #e59a8f; }
</style>
<link rel="stylesheet" href="carregar.css?v=1">
</head>
<body>
<header class="topo">
    <img src="Logo.png" alt="Maia Solutions">
    <span class="marca">Área do cliente</span>
</header>
<main id="conteudo">
    <div class="carregar" role="status">
        <div class="logo" aria-hidden="true">
            <img class="telhado" src="img/logo-telhado.webp" alt="">
            <img class="maia" src="img/logo-maia.webp" alt="">
            <img class="solutions" src="img/logo-solutions.webp" alt="">
        </div>
        <p>A carregar a sua obra…</p>
    </div>
</main>

<script>
const FUNCAO = "https://npyosbigynxmxdakcymg.supabase.co/functions/v1/area-cliente";
const TOKEN  = new URLSearchParams(location.search).get("t") || "";

const esc = s => String(s ?? "").replace(/[&<>"']/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dataPT = d => d ? new Date(d + "T12:00:00").toLocaleDateString("pt-PT") : "";
const euros  = v => v == null ? "" : Number(v).toLocaleString("pt-PT", { style: "currency", currency: "EUR" });
// Só links do nosso armazenamento; nunca outro endereço vindo da resposta.
const urlSegura = u => typeof u === "string" && u.startsWith("https://npyosbigynxmxdakcymg.supabase.co/") ? u : "#";

function linhaDoc(d, icone, extra = "") {
    // Sem link (falhou ao gerar): não se mostra um botão que não abre nada
    if (urlSegura(d.url) === "#") return `<div class="doc sem-link">
        <span class="ic">${icone}</span>
        <span class="tx">
            <span class="nm">${esc(d.numero || d.nome)}</span>
            <span class="dt">${esc(dataPT(d.data))}${extra ? " · " + extra : ""}</span>
        </span>
        <span class="abrir">Indisponível</span>
    </div>`;
    return `<a class="doc" href="${esc(urlSegura(d.url))}" target="_blank" rel="noopener noreferrer">
        <span class="ic">${icone}</span>
        <span class="tx">
            <span class="nm">${esc(d.numero || d.nome)}</span>
            <span class="dt">${esc(dataPT(d.data))}${extra ? " · " + extra : ""}</span>
        </span>
        <span class="abrir">Abrir ›</span>
    </a>`;
}

function estadoOrcamento(d) {
    const est = d.estado_orcamento === "aceite" ? `<span class="estado ok">Aceite</span>`
        : d.estado_orcamento === "recusado" ? `<span class="estado">Recusado</span>`
        : d.resposta_pendente ? `<span class="estado pend">${d.resposta_pendente.resposta === "aceite"
            ? "Aceitou · a aguardar confirmação" : d.resposta_pendente.resposta === "recusa"
            ? "Recusou · a aguardar" : "Pediu alterações · a aguardar"}</span>`
        : d.estado_orcamento === "enviado" ? `<span class="estado pend">A aguardar a sua resposta</span>` : "";
    return [d.total != null ? euros(d.total) + " com IVA" : "", est].filter(Boolean).join(" · ");
}

// Botões por baixo de um orçamento à espera de resposta
function respostaOrcamento(d) {
    if (d.estado_orcamento !== "enviado" || d.resposta_pendente) return "";
    return `<div class="resp" data-doc="${esc(d.id)}" data-numero="${esc(d.numero || d.nome)}" data-total="${esc(d.total != null ? euros(d.total) : "")}">${BOTOES_RESPOSTA}</div>`;
}
const BOTOES_RESPOSTA = `<div class="botoes">
    <button type="button" class="principal" data-passo="aceitar">Aceito este orçamento</button>
    <button type="button" data-passo="alterar">Pedir alterações</button>
    <button type="button" class="recusar" data-passo="recusar">Recusar</button>
</div>`;

function caixaResposta(el, passo) {
    const num = esc(el.dataset.numero), total = esc(el.dataset.total);
    if (passo === "aceitar") {
        el.innerHTML = `<div class="caixa">
            <p>Confirma que aceita o orçamento <b>${num}</b>${total ? `, no valor de <b>${total}</b> com IVA` : ""}?
            A Maia Solutions entra em contacto consigo para confirmar e combinar os passos seguintes.</p>
            <div class="botoes">
                <button type="button" class="principal" data-passo="enviar-aceite">Sim, aceito</button>
                <button type="button" data-passo="voltar">Cancelar</button>
            </div></div>`;
    } else if (passo === "alterar") {
        el.innerHTML = `<div class="caixa">
            <p>O que gostaria de alterar no orçamento <b>${num}</b>?</p>
            <textarea maxlength="2000" placeholder="Ex.: retirar a pintura exterior, mudar o pavimento da cozinha…"></textarea>
            <div class="botoes">
                <button type="button" class="principal" data-passo="enviar-alteracoes">Enviar pedido</button>
                <button type="button" data-passo="voltar">Cancelar</button>
            </div></div>`;
        el.querySelector("textarea").focus();
    } else if (passo === "recusar") {
        el.innerHTML = `<div class="caixa">
            <p>Confirma que recusa o orçamento <b>${num}</b>? Se quiser, diga-nos porquê: ajuda-nos a fazer melhor.</p>
            <textarea maxlength="2000" placeholder="Motivo (opcional). Ex.: preço acima do previsto, adiámos a obra…"></textarea>
            <div class="botoes">
                <button type="button" class="principal" data-passo="enviar-recusa">Sim, recuso</button>
                <button type="button" data-passo="voltar">Cancelar</button>
            </div></div>`;
        el.querySelector("textarea").focus();
    }
}

async function enviarResposta(el, tipo) {
    const comentario = tipo !== "aceite" ? (el.querySelector("textarea")?.value.trim() || "") : "";
    const avisar = msg => {
        el.querySelector(".erro")?.remove();
        el.querySelector(".caixa").insertAdjacentHTML("beforeend", `<div class="erro">${esc(msg)}</div>`);
    };
    if (tipo === "alteracoes" && !comentario) return avisar("Escreva o que gostaria de alterar.");
    el.querySelectorAll("button").forEach(b => b.disabled = true);
    try {
        const r = await fetch(FUNCAO, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: TOKEN, acao: "responder_orcamento", documento_id: el.dataset.doc, resposta: tipo, comentario }),
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.erro || "Erro " + r.status);
        await iniciar();
    } catch (e) {
        el.querySelectorAll("button").forEach(b => b.disabled = false);
        avisar(e.message);
    }
}

document.addEventListener("click", e => {
    const b = e.target.closest(".resp button");
    if (!b) return;
    const el = b.closest(".resp"), passo = b.dataset.passo;
    if (passo === "enviar-aceite") enviarResposta(el, "aceite");
    else if (passo === "enviar-alteracoes") enviarResposta(el, "alteracoes");
    else if (passo === "enviar-recusa") enviarResposta(el, "recusa");
    else if (passo === "voltar") el.innerHTML = BOTOES_RESPOSTA;
    else caixaResposta(el, passo);
});

function htmlFases(fases) {
    if (!fases.length) return "";
    const icone = { concluida: "✓", a_decorrer: "", por_fazer: "" };
    const quando = f => f.estado === "concluida"
        ? (f.data_fim ? "Concluída · " + dataPT(f.data_fim) : "Concluída")
        : [f.data_inicio ? (f.estado === "a_decorrer" ? "Começou a " : "Início previsto: ") + dataPT(f.data_inicio) : "",
           f.data_fim ? "Fim previsto: " + dataPT(f.data_fim) : ""].filter(Boolean).join(" · ");
    return `<h2>Andamento</h2><ul class="fases">${fases.map(f => `<li class="${esc(f.estado)}">
        <span class="ponto">${icone[f.estado] || ""}</span>
        <span><span class="nm">${esc(f.nome)}</span>${quando(f) ? `<br><span class="dt">${esc(quando(f))}</span>` : ""}</span>
    </li>`).join("")}</ul>`;
}

function htmlAutos(autos) {
    if (!autos.length) return "";
    return `<h2>Autos de medição</h2>${autos.slice().reverse().map(a => `<details class="auto">
        <summary><span class="nm">Auto nº ${esc(a.numero)} · ${esc(dataPT(a.data))}</span><span>${euros(a.total)} com IVA</span></summary>
        <table>
            ${a.linhas.map(l => `<tr><td>${esc(l.servico)}</td><td class="n">${esc(l.percentagem)}% feito</td><td class="n">${euros(l.valor)}</td></tr>`).join("")}
            <tr><td colspan="2" class="n">Total sem IVA</td><td class="n">${euros(a.total_sem_iva)}</td></tr>
            <tr><td colspan="2" class="n">IVA ${esc(a.taxa_iva)}%</td><td class="n">${euros(a.iva)}</td></tr>
            <tr class="tot"><td colspan="2" class="n">Total</td><td class="n">${euros(a.total)}</td></tr>
        </table>
        ${a.notas ? `<div class="notas">${esc(a.notas)}</div>` : ""}
    </details>`).join("")}`;
}

// Avanço por pacotes: a % de cada parte da obra, agrupada por zona
function htmlPacotes(pacotes) {
    if (!pacotes.length) return "";
    let zonaAnt = null;
    const variasZonas = new Set(pacotes.map(p => p.zona)).size > 1 || pacotes[0].zona;
    return `<h2>Avanço por zona</h2><div class="pacotes">${pacotes.map(p => {
        const tit = variasZonas && p.zona !== zonaAnt ? `<div class="zona">${esc(p.zona || "Geral")}</div>` : "";
        zonaAnt = p.zona;
        return `${tit}<div class="pac${p.percentagem >= 100 ? " feito" : ""}">
            <span>${esc(p.nome)}${p.atrasado ? ` <span class="atr">· atrasado</span>` : ""}</span>
            <span class="mini"><div style="width:${Number(p.percentagem) || 0}%"></div></span>
            <span class="pc">${p.percentagem >= 100 ? "✓" : esc(p.percentagem) + "%"}</span>
        </div>`;
    }).join("")}</div>`;
}

// O último corte semanal aprovado: o que avançou e as fotografias dessa semana
function htmlSemana(corte, fotos) {
    if (!corte) return "";
    const ini = corte.semana, fim = new Date(new Date(ini + "T12:00:00").getTime() + 6 * 86400000).toISOString().slice(0, 10);
    const daSemana = fotos.filter(d => d.data >= ini && d.data <= fim).slice(0, 8);
    return `<h2>Semana de ${esc(dataPT(ini))}</h2><div class="semana">
        ${corte.avancou.length
            ? `<div>O que avançou:</div><ul>${corte.avancou.map(l => `<li>${esc([l.zona, l.nome].filter(Boolean).join(" · "))}: ${esc(l.antes)}% → <b>${esc(l.depois)}%</b></li>`).join("")}</ul>`
            : `<div>Sem avanço registado nesta semana.</div>`}
        ${daSemana.length ? `<div class="fotos">${daSemana.map(htmlFoto).join("")}</div>` : ""}
    </div>`;
}

function htmlFoto(d) {
    return `<a href="${esc(urlSegura(d.url))}" target="_blank" rel="noopener noreferrer" title="${esc(d.nome)}">
        <img src="${esc(urlSegura(d.url))}" alt="Fotografia da obra" loading="lazy" onerror="this.parentNode.classList.add('falhou')">
        <span class="sem-pre"><b>📷</b>Abrir fotografia</span></a>`;
}

function htmlDiario(notas) {
    if (!notas.length) return "";
    const dia = d => new Date(d + "T12:00:00").toLocaleDateString("pt-PT", { weekday: "long", day: "numeric", month: "long" });
    return `<h2>Diário da obra</h2><div class="diario">${notas.map(n => `<div class="dia">
        <div class="dt">${esc(dia(n.data))}</div><div class="tx">${esc(n.notas)}</div></div>`).join("")}</div>`;
}

function htmlContas(c) {
    if (!c) return "";
    return `<div class="contas">
        <div><span>Valor da obra</span><b>${euros(c.valor)}</b></div>
        <div><span>Já pago</span><b>${euros(c.pago)}</b></div>
        <div><span>Falta pagar</span><b>${euros(c.falta)}</b></div>
    </div><p class="contas-nota">Valores sem IVA.</p>`;
}

function seccao(titulo, itens, vazio) {
    return `<h2>${titulo}</h2>${itens.length ? itens.join("") : `<div class="vazio">${vazio}</div>`}`;
}

function htmlObra(o, docs, fases, autos, diario, pacotes, corte) {
    // % pelos pacotes de trabalho (cada um pesado pelo valor, calculada no
    // servidor); sem pacotes, a % escrita na obra; sem ela, as fases
    // (concluídas contam inteiras, as a decorrer metade). Sem nada, não há barra.
    let pct = null;
    if (o.avanco != null) pct = Math.max(0, Math.min(100, Number(o.avanco) || 0));
    else if (o.percentagem_conclusao != null) pct = Math.max(0, Math.min(100, Number(o.percentagem_conclusao) || 0));
    else if (fases.length) pct = Math.round(fases.reduce((s, f) => s + (f.estado === "concluida" ? 1 : f.estado === "a_decorrer" ? .5 : 0), 0) / fases.length * 100);
    const feita = o.estado === "concluida";
    if (feita) pct = 100;
    const de = t => docs.filter(d => d.tipo === t);

    const orcs = de("orcamento").map(d => linhaDoc(d, "🧾", estadoOrcamento(d)) + respostaOrcamento(d));
    const fats = [...de("fatura"), ...de("recibo")]
        .sort((a, b) => String(b.data).localeCompare(String(a.data)))
        .map(d => d.tipo === "recibo"
            ? linhaDoc(d, "✅", "Recibo")
            : linhaDoc(d, "💶", [euros(d.total),
                d.paga == null ? "" : d.paga ? `<span class="estado ok">Paga</span>` : `<span class="estado pend">Por pagar</span>`]
                .filter(Boolean).join(" · ")));
    const fotos = de("foto").map(htmlFoto);
    const outros = de("outro").map(d => linhaDoc(d, "📄"));

    return `<section class="obra">
        <div class="obra-cab">
            <div>
                <div class="obra-nome">${esc(o.nome)}</div>
                ${o.local ? `<div class="obra-local">${esc(o.local)}</div>` : ""}
            </div>
            <span class="selo ${feita ? "feita" : "curso"}">${feita ? "✓ Concluída" : "Em curso"}</span>
        </div>
        ${pct != null ? `<div class="barra"><div style="width:${pct}%"></div></div>` : ""}
        <div class="meta">
            ${pct != null ? `<span>${pct}% concluída</span>` : ""}
            ${o.data_conclusao_prevista && !feita ? `<span>Conclusão prevista: ${esc(dataPT(o.data_conclusao_prevista))}</span>` : ""}
        </div>
        ${htmlContas(o.contas)}
        ${htmlSemana(corte, de("foto"))}
        ${htmlPacotes(pacotes)}
        ${htmlFases(fases)}
        ${htmlDiario(diario)}
        ${seccao("Orçamentos", orcs, "Ainda não há orçamentos.")}
        ${htmlAutos(autos)}
        ${seccao("Faturas e recibos", fats, "Ainda não há faturas.")}
        ${fotos.length ? `<h2>Fotografias</h2><div class="fotos">${fotos.join("")}</div>` : ""}
        ${outros.length ? seccao("Outros documentos", outros, "") : ""}
    </section>`;
}

async function iniciar() {
    const el = document.getElementById("conteudo");
    if (!TOKEN) {
        el.innerHTML = `<div class="centro">Este link não está completo.<br>Abra o link que recebeu da Maia Solutions.</div>`;
        return;
    }
    try {
        const r = await fetch(FUNCAO, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: TOKEN }),
        });
        const j = await r.json();
        if (!r.ok) throw new Error(j.erro || "Erro " + r.status);

        const obras = j.obras || [], docs = j.documentos || [];
        const primeiro = String(j.cliente?.nome || "").trim().split(/\s+/)[0];
        el.innerHTML = `
            <h1>Olá${primeiro ? ", " + esc(primeiro) : ""}</h1>
            <p class="sub">Aqui pode acompanhar ${obras.length === 1 ? "a sua obra" : "as suas obras"} e consultar os documentos.</p>
            ${j.links_falharam ? `<div class="aviso-links">Alguns documentos não abriram desta vez.<button type="button" onclick="location.reload()">Atualizar a página</button></div>` : ""}
            ${obras.length
                ? obras.map(o => htmlObra(o, docs.filter(d => d.obra_id === o.id),
                    (j.fases || []).filter(f => f.obra_id === o.id), (j.autos || []).filter(a => a.obra_id === o.id),
                    (j.diario || []).filter(n => n.obra_id === o.id), (j.pacotes || []).filter(p => p.obra_id === o.id),
                    (j.cortes || []).find(c => c.obra_id === o.id))).join("")
                : `<div class="centro">Ainda não há obras associadas.</div>`}
            <div class="rodape">Os links dos documentos valem 1 hora. Se algum não abrir, atualize a página.<br>Maia Solutions</div>`;
    } catch (e) {
        el.innerHTML = `<div class="centro">Não foi possível abrir a Área do cliente.<br>${esc(e.message)}<br><br>Se o problema continuar, contacte a Maia Solutions.</div>`;
    }
}
iniciar();
</script>

</html>
