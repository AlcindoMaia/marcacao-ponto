<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoje — Maia Solutions</title>
<link rel="stylesheet" href="style.css?v=3">

<style>
/* =======================================================
   ECRÃ HOJE
   Pensado para o telemóvel: uma coluna, cartões de decisão
   primeiro, agenda no fim. Em ecrã grande, centrado e estreito.
   ======================================================= */
body { background: var(--bg); }

.hoje-folha {
    max-width: 460px;
    margin: 0 auto;
    min-height: 100vh;
    background: #fff;
    padding: 22px 20px 104px;
    box-shadow: var(--shadow);
}

.hoje-topo       { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom: 26px; }
.hoje-data       { font-size: 13px; color: var(--text-muted); }
.hoje-titulo     { font-family: var(--font-title); font-size: 30px; line-height:1.1; margin: 2px 0 0; }
.hoje-sino       { background:none; border:none; font-size:19px; cursor:pointer; opacity:.6; padding:4px; }

.hoje-seccao     { font-size: 12px; color: var(--text-muted); margin: 22px 0 8px; }
.hoje-seccao:first-of-type { margin-top: 0; }

/* --- Cartões "Precisa de ti" --- */
.hoje-alerta {
    display:flex; align-items:center; gap:12px;
    padding: 12px 2px; width:100%;
    background:none; border:none; border-top:1px solid rgba(0,0,0,.07);
    text-align:left; cursor:pointer; font: inherit; color: inherit;
}
.hoje-alerta:first-of-type { border-top:none; }
.hoje-alerta:hover { background: rgba(0,0,0,.02); }
.hoje-icone {
    width:38px; height:38px; border-radius:9px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:17px;
}
.hoje-alerta-txt   { flex:1; min-width:0; }
.hoje-alerta-tit   { font-weight:600; font-size:15px; }
.hoje-alerta-sub   { font-size:12.5px; color: var(--text-muted); margin-top:1px; }
.hoje-seta         { color: var(--text-muted); font-size:17px; flex-shrink:0; }

/* --- Obras --- */
.hoje-obra       { padding: 12px 0; border-top:1px solid rgba(0,0,0,.07); }
.hoje-obra:first-of-type { border-top:none; }
.hoje-obra-linha { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.hoje-obra-nome  { font-weight:600; font-size:15px; }
.hoje-obra-sub   { font-size:12.5px; color: var(--text-muted); margin-top:1px; }
.hoje-barra      { height:5px; border-radius:3px; background: rgba(0,0,0,.08); margin-top:9px; overflow:hidden; }
.hoje-barra > i  { display:block; height:100%; background: var(--text-dark); border-radius:3px; }
.hoje-etiqueta   { font-size:11.5px; font-weight:600; padding:4px 10px; border-radius:20px; white-space:nowrap; }
.et-ok           { background: rgba(42,138,42,.12);  color:#1f6b1f; }
.et-aviso        { background: rgba(244,185,66,.22); color:#8a5e06; }
.et-mau          { background: rgba(192,57,43,.12);  color:#a4332a; }
.et-neutra       { background: rgba(0,0,0,.06);      color: var(--text-muted); }

/* --- Agenda --- */
.hoje-evento     { display:flex; gap:14px; padding:11px 0; border-top:1px solid rgba(0,0,0,.07); }
.hoje-evento:first-of-type { border-top:none; }
.hoje-quando     { width:52px; flex-shrink:0; font-size:13px; color: var(--text-muted); padding-top:1px; }
.hoje-evento-tit { font-weight:600; font-size:15px; }
.hoje-evento-sub { font-size:12.5px; color: var(--text-muted); margin-top:1px; }

.hoje-vazio      { font-size:13px; color: var(--text-muted); padding: 6px 0 2px; line-height:1.5; }

/* --- Barra do assistente --- */
.hoje-barra-ia {
    position: fixed; bottom:0; left:0; right:0;
    display:flex; justify-content:center; padding: 12px 16px 16px;
    background: linear-gradient(to top, #fff 65%, rgba(255,255,255,0));
    pointer-events: none;
}
.hoje-barra-ia > div {
    pointer-events: auto;
    width: 100%; max-width: 420px;
    display:flex; align-items:center; gap:10px;
    background:#fff; border:1px solid rgba(0,0,0,.14);
    border-radius: 26px; padding: 9px 14px; box-shadow: var(--shadow);
}
.hoje-pedido { flex:1; border:none; outline:none; font: inherit; font-size:14px; background:none; color: var(--text-dark); }
.hoje-pedido::placeholder { color: var(--text-muted); }
.hoje-acao   { background:none; border:none; font-size:17px; cursor:pointer; opacity:.65; padding:2px 4px; }
.hoje-acao:hover { opacity:1; }

.hoje-aviso-ia {
    max-width:420px; margin: 0 auto 8px; pointer-events:auto;
    font-size:12px; color: var(--text-muted); text-align:center;
}

/* Login, igual ao resto da plataforma */
#hojeLogin { max-width: 320px; margin: 90px auto; text-align:center; }
#hojeLogin input { width:100%; margin-bottom:10px; }
</style>
</head>
<body>

<!-- Pedir entrada quando não há sessão -->
<div id="hojeLogin" style="display:none">
    <h2 style="font-family:var(--font-title)">Hoje</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:18px">Entra com a tua conta de administrador.</p>
    <input id="hojeEmail" type="email" placeholder="email" autocomplete="username">
    <input id="hojePass" type="password" placeholder="password" autocomplete="current-password">
    <button class="btn-primary" id="hojeEntrar" style="width:100%">Entrar</button>
    <div id="hojeMsg" style="margin-top:10px;font-size:13px;color:#c0392b"></div>
</div>

<!-- O ecrã -->
<div class="hoje-folha" id="hojeFolha" style="display:none">

    <div class="hoje-topo">
        <div>
            <div class="hoje-data" id="hojeData"></div>
            <h1 class="hoje-titulo">Hoje</h1>
        </div>
        <button class="hoje-sino" id="hojeActualizar" title="Actualizar">🔄</button>
    </div>

    <div class="hoje-seccao" id="hojeAlertasTitulo">Precisa de ti</div>
    <div id="hojeAlertas"></div>

    <div class="hoje-seccao" id="hojeObrasTitulo">Obras</div>
    <div id="hojeObras"></div>

    <div class="hoje-seccao">Hoje e a seguir</div>
    <div id="hojeAgenda"></div>

</div>

<div class="hoje-barra-ia" id="hojeBarraIA" style="display:none">
    <div>
        <input class="hoje-pedido" id="hojePedido" placeholder="Pede material ao assistente">
        <button class="hoje-acao" id="hojeCamara" title="Ler fatura">📷</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="hoje.js"></script>
</body>
</html>
