<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maia Solutions</title>
<script>
  // Para onde vai quem abre a aplicação:
  //   com ?obra=...  -> a marcação de ponto do funcionário
  //   no telemóvel   -> o ecrã Hoje, com a visão geral e os atalhos
  //   no computador  -> o dashboard de sempre
  const params = window.location.search;

  if (params.includes('obra=')) {
    window.location.replace('app.html' + params);
  } else {
    const telemovel = window.matchMedia('(max-width: 820px)').matches;
    window.location.replace(telemovel ? 'hoje.html' : 'dashboard.html');
  }
</script>
</head>
<body></body>
</html>
