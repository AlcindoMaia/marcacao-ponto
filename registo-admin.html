<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://code.jquery.com https://cdn.datatables.net; style-src 'self' 'unsafe-inline' https://cdn.datatables.net https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://npyosbigynxmxdakcymg.supabase.co wss://npyosbigynxmxdakcymg.supabase.co; object-src 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e151d">
<title>Maia — Registo Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
/* Paleta “Azul-noite e caramelo”, a mesma do painel. O escuro é o tema
   de arranque; o claro fica guardado na mesma chave do painel ('tema'). */
:root {
  --header:   #0e151d;
  --bg:       #131c25;
  --bg2:      #1d2a37;
  --bg3:      #18232e;
  --border:   rgba(255,255,255,.08);
  --text:     #ece5de;
  --muted:    #a79e9c;
  --gold:     #b58863;
  --gold-dk:  #9a7150;
  --gold-txt: #d0a47f;
  --gold-lt:  rgba(181,136,99,.16);
  --green:    #8fbfa0;
  --red:      #e09486;
  --orange:   #e0b07a;
  --radius:   14px;
  --radsm:    10px;
  --fh:       'Oswald', sans-serif;
  --fb:       'Inter', sans-serif;
  --safe-b:   env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
body.tema-claro {
  --header:   #1c2b3a;
  --bg:       #efeae5;
  --bg2:      #ffffff;
  --bg3:      #f7f3ef;
  --border:   rgba(28,43,58,.12);
  --text:     #1c2b3a;
  --muted:    #5f6b72;
  --gold-txt: #9a7150;
  --gold-lt:  rgba(181,136,99,.14);
  --green:    #4f7a63;
  --red:      #a5483d;
  --orange:   #c08a52;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; background: #131c25; }
html:has(> body.tema-claro) { background: #efeae5; }
body {
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--fb);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; }

/* ── Loading ── */
#ecrãLoading {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
}
.loading-logo { height: 56px; animation: pulse 1.8s ease-in-out infinite; }
.loading-txt  { font-family: var(--fh); font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); }
@keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:.8} }

/* ── Ecrã principal ── */
#ecrãPrincipal {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding-bottom: calc(20px + var(--safe-b));
}
.conteudo { width: 100%; max-width: 760px; margin: 0 auto; padding: 0 16px; }

/* Cabeçalho azul-noite, como o do painel */
.header {
  background: var(--header);
  color: #fff;
  border-bottom: 1px solid rgba(255,255,255,.06);
  position: sticky; top: 0; z-index: 50;
}
.header .conteudo {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-top: 10px; padding-bottom: 10px;
}
.logo { height: 34px; border-radius: 4px; }
.header-titulo {
  font-family: var(--fh); font-size: 15px; font-weight: 400;
  letter-spacing: 1.5px; text-transform: uppercase;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.header-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.btn-nav {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 36px; height: 36px; padding: 0 10px;
  border-radius: 18px;
  border: 1px solid rgba(255,255,255,.18);
  background: rgba(255,255,255,.08);
  color: #fff;
  font-size: 15px;
  text-decoration: none;
  cursor: pointer;
  transition: background .15s;
}
.btn-nav:hover { background: rgba(255,255,255,.16); }
.btn-sair {
  height: 36px; padding: 0 14px;
  border-radius: 18px;
  border: none;
  background: transparent;
  color: rgba(255,255,255,.65);
  font-family: var(--fh); font-size: 12px; letter-spacing: 1px; text-transform: uppercase;
  cursor: pointer;
}
.btn-sair:hover { color: #fff; }

/* Título do dia */
.hero { padding-top: 18px; }
.hero-data {
  font-family: var(--fh); font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--gold-txt); margin-bottom: 2px;
}
.hero-titulo { font-family: var(--fh); font-size: 22px; font-weight: 500; letter-spacing: .5px; line-height: 1.2; }
.hero-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }

/* Barra de ferramentas: dia e ações */
.barra { padding-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.dia-nav { display: flex; align-items: center; gap: 6px; flex: 1 1 260px; min-width: 0; }
.dia-nav input[type="date"] {
  flex: 1; min-width: 0;
  height: 42px; padding: 0 12px;
  border-radius: var(--radsm);
  border: 1px solid var(--border);
  background: var(--bg2);
  color: var(--text);
  font-family: var(--fh); font-size: 15px; letter-spacing: .5px; text-align: center;
}
.btn-dia {
  width: 42px; height: 42px; flex-shrink: 0;
  border-radius: var(--radsm);
  border: 1px solid var(--border);
  background: var(--bg2);
  color: var(--text);
  font-size: 20px; line-height: 1;
  cursor: pointer;
}
.btn-dia:hover { border-color: var(--gold); color: var(--gold-txt); }
.acoes { display: flex; gap: 8px; flex: 0 0 auto; }
.btn-acao {
  height: 42px; padding: 0 14px;
  border-radius: var(--radsm);
  border: 1px solid var(--border);
  background: var(--bg2);
  color: var(--text);
  font-family: var(--fh); font-size: 12px; letter-spacing: 1px; text-transform: uppercase;
  white-space: nowrap;
  cursor: pointer;
}
.btn-acao:hover { border-color: var(--gold); }
.btn-acao.destaque { border-color: rgba(181,136,99,.5); background: var(--gold-lt); color: var(--gold-txt); }

/* Painel de temporários */
.temp-wrap { position: relative; }
#painelSelecionarTemp {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 200;
  min-width: 260px; max-width: calc(100vw - 32px);
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,.35);
}
.temp-titulo { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; padding: 0 4px; }
.temp-opcao { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.temp-opcao:hover { background: var(--gold-lt); }
.temp-novo {
  width: 100%; margin-top: 8px; padding: 9px;
  border-radius: 8px; border: 1px dashed rgba(181,136,99,.5);
  background: transparent; color: var(--gold-txt);
  font-size: 13px; font-weight: 600; cursor: pointer;
}
.etq-temp {
  font-size: 9px; font-weight: 700; letter-spacing: .5px;
  background: var(--gold-lt); color: var(--gold-txt);
  padding: 1px 6px; border-radius: 8px; margin-left: 5px; vertical-align: middle;
}

/* Lista de funcionários */
.func-lista { padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.func-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.func-card-header {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
}
.func-avatar {
  width: 38px; height: 38px; flex-shrink: 0;
  border-radius: 50%;
  background: var(--gold-lt);
  color: var(--gold-txt);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--fh); font-size: 17px; font-weight: 500;
}
.func-info { flex: 1; min-width: 0; }
.func-nome {
  font-family: var(--fh); font-size: 15px; font-weight: 500; letter-spacing: .3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.func-resumo { font-size: 12px; color: var(--muted); margin-top: 1px; }
.func-lado { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.func-toggle { font-size: 13px; color: var(--muted); transition: transform .2s; flex-shrink: 0; }
.func-card.aberto .func-toggle { transform: rotate(180deg); }
.btn-x { background: none; border: none; font-size: 20px; line-height: 1; cursor: pointer; color: var(--muted); padding: 0 4px; }

/* Linhas de registo (obra + horas) */
.func-linhas {
  display: none;
  flex-direction: column; gap: 8px;
  padding: 12px 14px 14px;
  border-top: 1px solid var(--border);
}
.func-card.aberto .func-linhas { display: flex; }
.linha-registo { display: grid; grid-template-columns: minmax(0,1fr) 76px 36px; gap: 8px; align-items: center; }
.linha-registo select,
.linha-registo input[type="number"] {
  height: 40px; padding: 0 10px; width: 100%;
  border-radius: var(--radsm);
  border: 1px solid var(--border);
  background: var(--bg3);
  color: var(--text);
  font-family: var(--fb); font-size: 14px;
}
.linha-registo select {
  -webkit-appearance: none; appearance: none;
  padding-right: 28px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50%;
  background-size: 5px 5px; background-repeat: no-repeat;
  text-overflow: ellipsis;
}
.linha-registo input[type="number"] { text-align: center; }
.linha-registo .sel-servico { grid-column: 1 / -1; height: 36px; font-size: 13px; }
.linha-registo select:focus, .linha-registo input:focus, .dia-nav input:focus { outline: none; border-color: var(--gold); }
.btn-rm-linha {
  width: 36px; height: 36px; border-radius: 50%; border: none;
  background: rgba(224,148,134,.14); color: var(--red);
  font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.btn-add-linha {
  margin-top: 2px; padding: 9px 14px; width: 100%;
  border-radius: var(--radsm);
  border: 1px dashed rgba(181,136,99,.45);
  background: transparent; color: var(--gold-txt);
  font-family: var(--fh); font-size: 12px; letter-spacing: 1px; text-transform: uppercase;
  cursor: pointer;
}
.input-temp-nome {
  background: transparent; border: none; border-bottom: 1px solid var(--border);
  font-size: 14px; font-weight: 600; width: 100%; padding: 2px 0; outline: none; color: inherit;
}

/* Estados */
.func-card.guardado { border-color: rgba(143,191,160,.45); }
.func-card.guardado .func-avatar { background: rgba(143,191,160,.2); color: var(--green); }
.func-card-temp { border: 1px dashed rgba(181,136,99,.5) !important; }
.btn-falta {
  font-size: 11px; font-weight: 600;
  padding: 5px 10px; border-radius: 20px;
  border: 1px solid rgba(224,148,134,.4);
  background: transparent; color: var(--red);
  cursor: pointer; white-space: nowrap; transition: background .2s;
}
.btn-falta:hover { background: rgba(224,148,134,.12); }
.btn-falta-activo { background: rgba(224,148,134,.2) !important; border-color: var(--red) !important; }
.avatar-falta { background: rgba(224,148,134,.2) !important; color: var(--red) !important; }
.avatar-temp  { background: var(--gold-lt) !important; color: var(--gold-txt) !important; }
.resumo-falta { color: var(--red) !important; }
.sel-motivo { width:auto; font-size:12px; padding:4px 6px; border-radius:8px; margin-right:6px; }
.sel-motivo.sem-motivo { border:1px solid var(--red); color: var(--red); }

/* Guardar: fica sempre à mão no fundo do ecrã */
.rodape {
  position: sticky; bottom: 0; z-index: 40;
  padding-top: 12px;
  padding-bottom: calc(12px + var(--safe-b));
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}
.btn-guardar-tudo {
  width: 100%; padding: 15px;
  border-radius: var(--radius); border: none;
  background: var(--gold); color: #fff;
  font-family: var(--fh); font-size: 16px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(0,0,0,.25);
  transition: transform .15s, background .15s;
}
.btn-guardar-tudo:hover { background: var(--gold-dk); }
.btn-guardar-tudo:active { transform: scale(.98); }

.feedback-geral {
  margin-top: 10px; padding: 11px 14px;
  border-radius: var(--radsm);
  font-family: var(--fh); font-size: 13px; letter-spacing: .5px; text-align: center;
}
.feedback-geral:empty { display: none; }
.feedback-geral.ok   { background: rgba(143,191,160,.14); color: var(--green); border: 1px solid rgba(143,191,160,.3); }
.feedback-geral.erro { background: rgba(224,148,134,.12); color: var(--red);   border: 1px solid rgba(224,148,134,.3); }

/* ── Comparação ── */
#ecrãComparacao { min-height: 100dvh; display: flex; flex-direction: column; padding-bottom: calc(20px + var(--safe-b)); }
.btn-back { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; padding: 0 6px 0 0; line-height: 1; }
.comp-lista { padding-top: 16px; display: flex; flex-direction: column; gap: 8px; }
.comp-resumo { display: flex; gap: 8px; margin-bottom: 8px; }
.comp-resumo > div { flex: 1; border-radius: 10px; padding: 10px 12px; text-align: center; background: var(--bg2); border: 1px solid var(--border); }
.comp-resumo b { display: block; font-family: var(--fh); font-size: 22px; font-weight: 500; }
.comp-resumo span { font-size: 10px; color: var(--muted); font-family: var(--fh); letter-spacing: 1px; text-transform: uppercase; }
.comp-item {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-left: 3px solid transparent;
  border-radius: var(--radsm);
  padding: 12px 14px;
}
.comp-item.ok                { border-left-color: var(--green); }
.comp-item.horas_diferentes  { border-left-color: var(--orange); }
.comp-item.obra_diferente    { border-left-color: var(--orange); }
.comp-item.sem_registo_colab { border-left-color: var(--red); }
.comp-item.registo_incompleto{ border-left-color: var(--red); }
.comp-nome { font-family: var(--fh); font-size: 14px; font-weight: 500; letter-spacing: .3px; margin-bottom: 3px; }
.comp-detalhe { font-size: 12px; color: var(--muted); line-height: 1.6; }
.comp-badge {
  display: inline-block; margin-top: 5px; padding: 2px 8px; border-radius: 4px;
  font-size: 10px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
}
.badge-ok    { background: rgba(143,191,160,.16); color: var(--green); }
.badge-aviso { background: rgba(224,176,122,.16); color: var(--orange); }
.badge-erro  { background: rgba(224,148,134,.14); color: var(--red); }
.comp-vazio  { padding: 32px; text-align: center; color: var(--muted); font-size: 13px; font-family: var(--fh); letter-spacing: 1px; }

/* ── Login ── */
#ecrãLogin { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 32px 24px; }
.login-box { width: 100%; max-width: 340px; text-align: center; }
.login-logo { height: 64px; margin-bottom: 24px; }
.login-titulo { font-family: var(--fh); font-size: 18px; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 24px; }
.login-input {
  width: 100%; padding: 12px 16px; margin-bottom: 12px;
  border-radius: var(--radsm); border: 1px solid var(--border);
  background: var(--bg2); color: var(--text);
  font-family: var(--fb); font-size: 15px;
}
.login-btn {
  width: 100%; padding: 13px;
  border-radius: var(--radsm); border: none;
  background: var(--gold); color: #fff;
  font-family: var(--fh); font-size: 15px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase;
  cursor: pointer;
}
.login-msg { font-size: 13px; color: var(--red); margin-top: 10px; min-height: 18px; font-family: var(--fh); }

.hidden-painel { display: none !important; }

@media (max-width: 480px) {
  .header-titulo { display: none; }
  .acoes { width: 100%; }
  .acoes > * { flex: 1; }
  .acoes .btn-acao { width: 100%; }
  .btn-falta { padding: 5px 8px; }
}
</style>
</head>
<body>
<script>try{if(localStorage.getItem("tema")==="claro")document.body.classList.add("tema-claro")}catch(e){}</script>

<!-- LOGIN -->
<div id="ecrãLogin" style="display:flex">
  <div class="login-box">
    <img src="Logo.png" class="login-logo" alt="Maia Solutions">
    <div class="login-titulo">Registo Diário</div>
    <input class="login-input" id="loginEmail" type="email" placeholder="Email" autocomplete="email">
    <input class="login-input" id="loginPassword" type="password" placeholder="Password">
    <button class="login-btn" id="loginBtn">Entrar</button>
    <div class="login-msg" id="loginMsg"></div>
  </div>
</div>

<!-- LOADING -->
<div id="ecrãLoading" style="display:none">
  <img src="Logo.png" class="loading-logo" alt="Maia">
  <div class="loading-txt">A carregar…</div>
</div>

<!-- ECRÃ PRINCIPAL -->
<div id="ecrãPrincipal" style="display:none">

  <header class="header">
    <div class="conteudo">
      <img src="Logo.png" class="logo" alt="Maia">
      <div class="header-titulo">Registo diário</div>
      <div class="header-right">
        <button class="btn-nav" id="btnTemaRegisto" onclick="toggleTemaRegisto()" title="Modo claro">☀️</button>
        <a href="assistente.html" class="btn-nav" title="Assistente">✨ Assistente</a>
        <a href="admin.html" class="btn-nav" title="Painel">⚙</a>
        <button class="btn-sair" onclick="fazerLogout()">Sair</button>
      </div>
    </div>
  </header>

  <div class="conteudo">
    <div class="hero">
      <div class="hero-data" id="heroData">—</div>
      <div class="hero-titulo">Quem trabalhou hoje?</div>
      <div class="hero-sub">Regista as horas e obras de cada colaborador</div>
    </div>

    <div class="barra">
      <div class="dia-nav">
        <button class="btn-dia" onclick="navegarDia(-1)" title="Dia anterior">‹</button>
        <input type="date" id="dataRegisto">
        <button class="btn-dia" onclick="navegarDia(1)" title="Dia seguinte">›</button>
      </div>
      <div class="acoes">
        <div class="temp-wrap">
          <button class="btn-acao destaque" onclick="adicionarTrabalhadorTemp()"
              title="Adicionar trabalhador temporário/esporádico">+ Temporário</button>
          <!-- Painel de seleção de temporários -->
          <div id="painelSelecionarTemp" class="hidden-painel">
            <div class="temp-titulo">Temporários</div>
            <div id="listaTempsExistentes"></div>
            <button class="temp-novo" onclick="adicionarNovoTemp()">+ Novo temporário</button>
          </div>
        </div>
        <button class="btn-acao" onclick="mostrarComparacao()">⚖ Comparar</button>
      </div>
    </div>

    <!-- Lista de funcionários -->
    <div class="func-lista" id="funcLista"></div>

    <!-- Botão guardar -->
    <div class="rodape">
      <button class="btn-guardar-tudo" onclick="guardarTudo()">✓ Guardar registo</button>
      <div class="feedback-geral" id="feedbackGeral"></div>
    </div>
  </div>

</div>

<!-- ECRÃ COMPARAÇÃO -->
<div id="ecrãComparacao" style="display:none">
  <header class="header">
    <div class="conteudo">
      <button class="btn-back" onclick="voltarPrincipal()" title="Voltar">‹</button>
      <div class="header-titulo" style="display:block">Comparação de registos</div>
    </div>
  </header>
  <div class="conteudo">
    <div class="comp-lista" id="compLista">
      <div class="comp-vazio">A carregar…</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js" integrity="sha384-KX6Y/AMIv9qA8TLCDul2JatZWeyrJVgj3Xu/0r30Nr05xO8md1+wHAgtdsRV9LoE" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="config.js?v=3"></script>
<script src="registo-admin.js?v=5"></script>
</body>
</html>
